[tools]
node = "24"
bun = "1.4.2"
"npm:windmill-cli" = "1.817.0"
gh = "2.101.0"
lefthook = "2.1.14"
gitleaks = "8.30.1"

[env]
WMILL_CONFIG_DIR = "{{config_root}}/.wmill"
WM_VERSION = "1.817.0"
WM_HTTP_PORT = "8080"
WM_BIND = "127.0.0.1"
WM_BASE_URL = "http://127.0.0.1:8080"
# console_fetcherが成果物を取りに行くリポジトリ。フォークで動かすときは書き換える。
CONSOLE_GITHUB_REPO = "https://github.com/u-stem/atelier-works"
CLAUDE_VERSION = "2.1.282"
GH_VERSION = "2.101.0"
GITLEAKS_VERSION = "8.30.1"
GTR_REF = "v2.11.1"
GTR_COMMIT = "f4df6344a362303e6b47bc92955fef3bba468426"
WMILL_VERSION = "1.817.0"
LOG_MAX_SIZE = "20m"
LOG_MAX_FILE = "10"

[tasks.up]
description = "Start the local Windmill stack"
run = """
scripts/check-docker-version.sh
docker compose -f infra/docker-compose.yml up -d --build
"""

[tasks.down]
description = "Stop the local Windmill stack"
run = "docker compose -f infra/docker-compose.yml down"

[tasks.build]
description = "Build the worker image"
run = "docker compose -f infra/docker-compose.yml build windmill_worker"

[tasks.logs]
description = "Tail logs from the local Windmill stack"
run = "docker compose -f infra/docker-compose.yml logs -f"

[tasks."console:rollback"]
description = "Switch the console back to the previous release and pin it"
run = "docker compose -f infra/docker-compose.yml run --rm --no-deps console_fetcher rollback"

[tasks."console:unpin"]
description = "Remove the console pin so console_fetcher resumes automatic updates"
run = "docker compose -f infra/docker-compose.yml run --rm --no-deps console_fetcher unpin"

[tasks.setup]
description = "Install mise-managed tools, project dependencies, and git hooks"
run = """
mise install
bun install --frozen-lockfile --ignore-scripts
bun install --cwd console --frozen-lockfile --ignore-scripts
lefthook install
"""

[tasks.deploy]
description = "Update checkout, rebuild, restart, push, and migrate"
run = """
git pull --ff-only
scripts/check-docker-version.sh
docker compose -f infra/docker-compose.yml pull
docker compose -f infra/docker-compose.yml build windmill_worker console_fetcher
docker compose -f infra/docker-compose.yml up -d
npm ci --prefix f/factory/factory_console__raw_app --no-audit --no-fund --ignore-scripts
NPM_CONFIG_IGNORE_SCRIPTS=true wmill sync push --yes --keep-deleted
wmill datatable migrate up
"""

[tasks.push]
description = "Push local sync state to the Windmill workspace (keeps remote-only items)"
run = """
npm ci --prefix f/factory/factory_console__raw_app --no-audit --no-fund --ignore-scripts
NPM_CONFIG_IGNORE_SCRIPTS=true wmill sync push --yes --keep-deleted
"""

[tasks."push:prune"]
description = "Push and delete remote items that no longer exist locally (manual only)"
run = "NPM_CONFIG_IGNORE_SCRIPTS=true wmill sync push --yes"

[tasks."push:dry"]
description = "Dry-run of wmill sync push"
run = "NPM_CONFIG_IGNORE_SCRIPTS=true wmill sync push --dry-run"

[tasks.pull]
description = "Pull remote Windmill state into the sync root"
run = "wmill sync pull"

[tasks.migrate]
description = "Apply pending datatable migrations"
run = "wmill datatable migrate up"

[tasks.metadata]
description = "Regenerate stale Windmill metadata (locks and schemas)"
run = "wmill generate-metadata --yes"

[tasks."metadata:check"]
description = "Fail if Windmill metadata (locks and schemas) is stale"
run = "scripts/check-metadata-fresh.sh"

[tasks.lint]
description = "Run biome, wmill lint, and the type-assertion, section-sign, and short-remote-ref lint scripts"
run = """
bunx --bun biome check .
if [ -d f ]; then wmill lint f; fi
bun run scripts/lint-no-type-assertions.ts
bun run scripts/lint-no-section-sign.ts
bun run scripts/lint-no-short-remote-ref.ts
"""

[tasks.typecheck]
description = "Type-check the repository"
run = "bunx --bun tsc --noEmit"

[tasks.test]
description = "Run the test suite (the console has its own suite in console:check)"
run = "bun test --path-ignore-patterns 'console/**'"

[tasks."lint:docs"]
description = "Lint the Markdown documents (repository rules, markdownlint, textlint, generated blocks)"
run = "bun run scripts/lint-docs.ts"

[tasks."docs:gen"]
description = "Regenerate the generated blocks in the documents"
run = "bun run scripts/docs-gen.ts"

[tasks.check]
description = "Run lint, lint:docs, typecheck, test, and the console checks in order"
run = """
mise run lint
mise run lint:docs
mise run typecheck
mise run test
mise run console:check
"""

[tasks."console:check"]
description = "Check the console lockfile policy, then type-check, test, and build the console"
run = """
bun run scripts/check-console-lockfile.ts console/bun.lock
bun run --cwd console typecheck
bun run --cwd console test
bun run --cwd console build
"""

[tasks.doctor]
description = "Run environment diagnostics"
run = "scripts/doctor.sh"

[tasks.bootstrap]
description = "Bootstrap the local Windmill workspace"
run = "scripts/bootstrap.sh"

[tasks."test:db"]
description = "Apply datatable migrations to a scratch database and SELECT from every view"
run = "scripts/test-db.sh"

[tasks."check:comment-only"]
description = "Fail if the diff against a base ref (default main) changes anything but comments"
run = "bun run scripts/check-comment-only-diff.ts"
