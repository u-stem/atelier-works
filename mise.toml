[tools]
node = "24"
bun = "1.4.2"
"npm:windmill-cli" = "1.817.0"
gh = "2.101.0"
lefthook = "2.1.14"
gitleaks = "8.30.1"

[env]
WMILL_CONFIG_DIR = "{{config_root}}/.wmill"
WM_VERSION = "1.817.0"
WM_HTTP_PORT = "8080"
WM_BIND = "127.0.0.1"
# ログインのセッションの有効期間(秒)。30日にする。Windmillの既定は3日。
# windmill_serverにだけ渡す。変えたら`mise run up`をやり直す。
WM_SESSION_VALIDITY_SECONDS = "2592000"
WM_BASE_URL = "http://127.0.0.1:8080"
# console_fetcherが成果物を取りに行くリポジトリ。フォークで動かすときは書き換える。
CONSOLE_GITHUB_REPO = "https://github.com/u-stem/atelier-works"
CLAUDE_VERSION = "2.1.282"
GH_VERSION = "2.101.0"
GITLEAKS_VERSION = "8.30.1"
GTR_REF = "v2.11.1"
GTR_COMMIT = "f4df6344a362303e6b47bc92955fef3bba468426"
WMILL_VERSION = "1.817.0"
# 検査コマンドを動かす非特権ユーザー`factory-check-N`の先頭のuidと数。workerのイメージのビルド引数になる。
# workerのscriptは、ユーザーのuidを`/etc/passwd`から読む。数は、workerの同時実行数(1)に、片付けられず飛ばす枠の分を足した数以上にする。
FACTORY_CHECK_UID = "10001"
FACTORY_CHECK_POOL_SIZE = "8"
LOG_MAX_SIZE = "20m"
LOG_MAX_FILE = "10"

[tasks.up]
description = "Start the local Windmill stack (refuses while a deploy freeze is active)"
run = """
set -e
scripts/check-docker-version.sh
bun ./scripts/freeze.ts check
docker compose -f infra/docker-compose.yml pull --ignore-pull-failures
docker compose -f infra/docker-compose.yml build
docker compose -f infra/docker-compose.yml run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile
bun ./scripts/check-idle.ts --when-worker-recreated
docker compose -f infra/docker-compose.yml up -d --pull never --no-build
docker compose -f infra/docker-compose.yml restart caddy
docker compose -f infra/docker-compose.yml exec -T caddy caddy validate --config /etc/caddy/Caddyfile
scripts/record-host-applied.sh
docker image prune -f --filter label=com.atelier-works.prune=true || echo "up: image prune failed (ignored)" >&2
"""

[tasks.down]
description = "Stop the local Windmill stack"
run = "docker compose -f infra/docker-compose.yml down"

[tasks.build]
description = "Build the worker image"
run = "docker compose -f infra/docker-compose.yml build windmill_worker"

[tasks.logs]
description = "Tail logs from the local Windmill stack"
run = "docker compose -f infra/docker-compose.yml logs -f"

[tasks."console:rollback"]
description = "Switch the console back to the previous release and pin it"
run = "docker compose -f infra/docker-compose.yml run --rm --no-deps console_fetcher rollback"

[tasks."console:unpin"]
description = "Remove the console pin so console_fetcher resumes automatic updates"
run = "docker compose -f infra/docker-compose.yml run --rm --no-deps console_fetcher unpin"

[tasks.setup]
description = "Install mise-managed tools, project dependencies, and git hooks"
run = """
mise install
bun install --frozen-lockfile --ignore-scripts
bun install --cwd console --frozen-lockfile --ignore-scripts
lefthook install
"""

[tasks.deploy]
description = "Update checkout, rebuild, restart, push, and migrate (refuses while a deploy freeze is active)"
run = """
set -e
bun ./scripts/freeze.ts check
git pull --ff-only
scripts/check-docker-version.sh
docker compose -f infra/docker-compose.yml pull
docker compose -f infra/docker-compose.yml build
docker compose -f infra/docker-compose.yml run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile
bun ./scripts/check-idle.ts --when-worker-recreated --after-pull
docker compose -f infra/docker-compose.yml up -d --pull never --no-build
docker compose -f infra/docker-compose.yml restart caddy
docker compose -f infra/docker-compose.yml exec -T caddy caddy validate --config /etc/caddy/Caddyfile
bun ./scripts/freeze.ts apply
scripts/record-host-applied.sh
docker image prune -f --filter label=com.atelier-works.prune=true || echo "deploy: image prune failed (ignored)" >&2
"""

[tasks.push]
description = "Push local sync state to the Windmill workspace (keeps remote-only items; refuses while a deploy freeze is active)"
run = "bun ./scripts/freeze.ts push"

[tasks."push:prune"]
description = "Push and delete remote items that no longer exist locally (manual only)"
run = "bun ./scripts/freeze.ts push --prune"
# 端末での確認(yesの入力)を通すため、stdinとstdoutをそのままつなぐ
raw = true

[tasks."push:dry"]
description = "Dry-run of wmill sync push"
run = "bun ./scripts/freeze.ts push --dry-run"

[tasks."freeze:place"]
description = "Freeze a schedule so wmill sync push leaves it alone, or hold every deployment (usage: -- --target f/factory/<name> --minutes <n> --reason <text>, or -- --scope deploy --minutes <n> --reason <text>)"
run = "bun ./scripts/freeze.ts place"
raw = true

[tasks."freeze:list"]
description = "List the schedule freezes and the deploy freezes"
run = "bun ./scripts/freeze.ts list"

[tasks."freeze:release"]
description = "Release a schedule freeze or a deploy freeze (usage: -- <id>)"
run = "bun ./scripts/freeze.ts release"
raw = true

[tasks."freeze:reset"]
description = "Clear every schedule freeze and deploy freeze, including a corrupt state (human only)"
run = "bun ./scripts/freeze.ts reset"
raw = true

[tasks."hold:list"]
description = "List the holds that stop the Factory, and the schedule freezes and deploy freezes in effect"
run = "bun ./scripts/hold.ts list"

[tasks."hold:place"]
description = "Place a hold that stops merges of a repository (usage: -- --scope merge --target <owner>/<repo> --minutes <n> --reason <text>)"
run = "bun ./scripts/hold.ts place"
raw = true

[tasks."hold:release"]
description = "Release a hold (usage: -- <id>)"
run = "bun ./scripts/hold.ts release"
raw = true

[tasks.pull]
description = "Pull remote Windmill state into the sync root"
run = "wmill sync pull"

[tasks.migrate]
description = "Apply pending datatable migrations (refuses while a deploy freeze is active)"
run = "bun ./scripts/freeze.ts migrate"

[tasks.metadata]
description = "Regenerate stale Windmill metadata (locks and schemas)"
run = "wmill generate-metadata --yes"

[tasks."metadata:check"]
description = "Fail if Windmill metadata (locks and schemas) is stale"
run = "scripts/check-metadata-fresh.sh"

[tasks.lint]
description = "Run biome, wmill lint, and the type-assertion, section-sign, and short-remote-ref lint scripts"
run = """
bunx --bun biome check .
if [ -d f ]; then wmill lint f; fi
bun run scripts/lint-no-type-assertions.ts
bun run scripts/lint-no-section-sign.ts
bun run scripts/lint-no-short-remote-ref.ts
"""

[tasks.typecheck]
description = "Type-check the repository"
run = "bunx --bun tsc --noEmit"

[tasks.test]
description = "Run the test suite (the console has its own suite in console:check)"
run = "bun test --parallel --path-ignore-patterns 'console/**'"

[tasks."test:changed"]
description = "Run only the tests affected by the diff against origin/main (CI still runs the full suite)"
run = "bun test --parallel --changed=origin/main --path-ignore-patterns 'console/**'"

[tasks."lint:docs"]
description = "Lint the Markdown documents (repository rules, markdownlint, textlint, generated blocks)"
run = "bun run scripts/lint-docs.ts"

[tasks."docs:gen"]
description = "Regenerate the generated blocks in the documents and the flow graph data for the console"
run = "bun run scripts/docs-gen.ts"

[tasks.check]
description = "Run lint, lint:docs, typecheck, test, and the console checks in order"
run = """
mise run lint
mise run lint:docs
mise run typecheck
mise run test
mise run console:check
"""

[tasks."console:check"]
description = "Check the console lockfile policy, then type-check, test, and build the console"
run = """
bun run scripts/check-console-lockfile.ts console/bun.lock
bun run --cwd console typecheck
bun run --cwd console test
bun run --cwd console build
"""

[tasks.doctor]
description = "Run environment diagnostics"
run = "scripts/doctor.sh"

[tasks.bootstrap]
description = "Bootstrap the local Windmill workspace"
run = "scripts/bootstrap.sh"

[tasks."instance:tags"]
description = "Allow the console and periodic custom tags on the running Windmill instance (idempotent)"
run = "scripts/bootstrap.sh custom-tags"

[tasks."test:db"]
description = "Apply datatable migrations to a scratch database and SELECT from every view"
run = "scripts/test-db.sh"

[tasks."test:check-sandbox"]
description = "Run the check command sandbox tests in a throwaway container of the worker image"
run = "scripts/verify-check-sandbox.sh"

[tasks."check:comment-only"]
description = "Fail if the diff against a base ref (default main) changes anything but comments"
run = "bun run scripts/check-comment-only-diff.ts"

[tasks."worktree:new"]
description = "Create a worktree for type/name from origin/main and install its dependencies"
run = "scripts/worktree-new.sh"

[tasks."worktree:prune"]
description = "List (dry run) or remove (--apply) merged, clean worktrees under .claude/worktrees"
run = "scripts/worktree-prune.sh"
