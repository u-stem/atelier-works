# Extends gitleaks' built-in ruleset with atelier-works-specific secret
# formats that the default rules do not cover.
[extend]
useDefault = true

[[rules]]
id = "claude-code-oauth-token"
description = "Claude Code long-lived OAuth token assigned to CLAUDE_CODE_OAUTH_TOKEN"
regex = '''(?i)claude_code_oauth_token\s*[:=]\s*["']?[A-Za-z0-9_-]{80,}["']?'''
tags = ["claude", "oauth", "atelier-works"]

[[rules]]
id = "claude-code-oauth-token-prefix"
description = "Claude Code long-lived OAuth token by its sk-ant-oat prefix"
regex = '''sk-ant-oat[0-9]{2}-[A-Za-z0-9_-]{60,}'''
tags = ["claude", "oauth", "atelier-works"]

[[rules]]
id = "discord-webhook-url"
description = "Discord webhook URL"
regex = '''https://(discord|discordapp)\.com/api/webhooks/[0-9]+/[A-Za-z0-9_-]+'''
tags = ["discord", "webhook", "atelier-works"]
[rules.allowlist]
# Test fixtures use an obviously fake token segment.
regexTarget = "line"
regexes = ['''fake-webhook-token-value''']

[[rules]]
id = "windmill-secret-variable-value"
description = "Windmill secret variable (f/**/*.variable.yaml) has a non-empty value while is_secret: true"
regex = '''(?m)^value:[ \t]*("[^"\n]+"|'[^'\n]+'|[^"'\s][^\n]*)[ \t]*\r?\n(?:[^\n]*\r?\n){0,2}is_secret:[ \t]*true'''
path = '''(^|/)f/.*\.variable\.ya?ml$'''
tags = ["windmill", "atelier-works"]

# Known false positives:
# - wmill-lock.yaml holds content hashes of workspace scripts; a hash next to
#   the module name "discord" trips the built-in discord-api-token rule.
# - tests use obviously fake webhook URLs as masking fixtures.
[allowlist]
paths = ['''^wmill-lock\.yaml$''']
