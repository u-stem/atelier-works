description: >-
  Software Factoryの動作を決める設定です。対象リポジトリの所有者、各種ラベル名、Claude Codeの工程ごとのモデルと実行上限・予算、インスタンスを識別する情報などを持ちます。
format_extension: null
is_fileset: false
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - owners
    - trigger_label
    - allowed_labeler_associations
    - allowed_labeler_logins
    - allowed_labeler_ids
    - model
    - heavy_model
    - max_attempts
    - max_turns
    - max_budget_usd_per_run
    - daily_budget_usd
    - claude_timeout_sec
    - worktree_ttl_days
    - retention_work_items_days
    - retention_logs_days
    - factory_repo
    - factory_repo_id
    - factory_branch
    - instance_name
    - windmill_public_url
    - review_label
    - fix_label
    - tracked_pr_days
    - review_post_mode
    - max_fix_rounds
    - allowed_check_commands
    - default_reviewers
    - repo_allowlist
    - diff_max_lines
    - max_fix_changed_files
    - max_fix_diff_lines
    - max_lookback_days
    - implement_enabled
    - implement_max_rounds
    - implement_max_turns
    - implement_max_budget_usd_per_run
    - implement_timeout_sec
    - implement_check_timeout_sec
    - implement_flow_timeout_sec
    - implement_max_changed_files
    - implement_max_diff_lines
    - dependabot_enabled
    - dependabot_merge_enabled
    - dependabot_min_published_days
    - pr_ci_watch_enabled
    - pr_ci_watch_human_prs
    - pr_ci_fix_enabled
    - pr_ci_fix_max_rounds
    - pr_ci_fix_enabled_since
    - pr_conflict_watch_enabled
    - worker_alert_memory_ratio
    - check_commands_by_repo
  properties:
    allowed_check_commands:
      type: array
      description: >-
        修正内容を検証するために実行するコマンド(例: ["mise run check"])。対象リポジトリのコードをFactoryの実行環境でそのまま実行するため隔離はされません。通常は空のままにし、信頼できるリポジトリだけで使ってください。
      default: []
      items:
        type: string
    allowed_labeler_associations:
      type: array
      description: >-
        PRのレビューと修正で、コメントやレビューの投稿者として扱うGitHub上の関係(所有者・メンバー・コラボレーターなど)です。ここに含まれない人の発言は、修正の指摘に使いません。トリガーラベルを付けた人の確認には使わず、`allowed_labeler_logins`で行います。
      default:
        - OWNER
        - MEMBER
        - COLLABORATOR
      items:
        type: string
        enum:
          - OWNER
          - MEMBER
          - COLLABORATOR
    allowed_labeler_logins:
      type: array
      description: >-
        トリガーラベル(`trigger_label`、`review_label`、`fix_label`)を付けてよい、Factoryを動かすアカウント以外のGitHubのログイン名です。空の場合は、Factoryのアカウントが付けたラベルにだけ反応します。大文字小文字は区別しません。他人の入力に応じてラベルを付ける自動化のアカウントや、FactoryのPATを使う自動化は、許可しないでください。`[bot]`で終わるログイン名は設定の検証で拒否します。許可はログイン名で判定します。アカウント名を変更すると、古い名前を他人が取れることがあります。名前を変えたアカウントは外すか、`allowed_labeler_ids`にIDを入れてください。
      default: []
      items:
        type: string
    allowed_labeler_ids:
      type: object
      description: >-
        `allowed_labeler_logins`のアカウントの、GitHubの数値IDです。キーはログイン名(`allowed_labeler_logins`に含まれる名前。大文字小文字は区別しません)、値は`gh api users/<ログイン名> --jq .id`で調べた数値IDです。IDを入れたアカウントは、同じ名前でもIDが違う人が付けたラベルを許可しません。アカウント名を変更した後に別の人がその名前を取っても、拒否されます。入れないアカウントは名前だけで照合します。`[bot]`で終わるキー、`allowed_labeler_logins`に無いキー、大文字小文字だけが違う重複したキーは、設定の検証で拒否します。
      default: {}
      additionalProperties:
        type: integer
    check_commands_by_repo:
      type: object
      description: >-
        リポジトリ別の検査コマンドです。キーは`<owner>/<repo>`(大文字小文字は区別しない)、値はそのリポジトリの実装(工程3)で実行するコマンドの配列です。エントリが無いリポジトリでは検査コマンドを実行しません(`allowed_check_commands`は使いません)。検査コマンドはClaudeが書いたコードを隔離なしで実行するため、Issueを信頼できる人だけが起票するリポジトリだけに設定してください。
      default: {}
      additionalProperties:
        type: array
        items:
          type: string
    claude_timeout_sec:
      type: integer
      description: Claude Codeの1回の実行を打ち切るまでの制限時間(秒)。
      default: 1800
    daily_budget_usd:
      type: number
      description: >-
        1日あたりのClaude利用上限(USD)。超えるとその日の自動処理は人の対応待ちになります。
      default: 50
    default_reviewers:
      type: array
      description: >-
        修正を反映した直後のPRに、レビュワーとして指定するGitHubのログイン名です。空の場合は、PRに既に設定されているレビュワーをそのまま使います。
      default: []
      items:
        type: string
    dependabot_enabled:
      type: boolean
      description: >-
        dependabotのセキュリティ更新PRを自動で処理するかどうかです。falseの間は、dependabotのPRに何もしません。
      default: false
    dependabot_merge_enabled:
      type: boolean
      description: >-
        dependabotの更新PRを、条件を満たしたときに自動でマージするかどうかです。falseの間は、マージできると判断したPRもマージせず、人の対応待ちにします。dependabot_enabledを有効にして試運転の結果を確かめてから、有効にします。
      default: false
    dependabot_min_published_days:
      type: integer
      description: >-
        dependabotの更新先の版が公開されてから、マージしてよくなるまでの日数です。この日数に満たない版は自動でマージしません。1以上の整数にします。
      default: 7
    diff_max_lines:
      type: integer
      description: >-
        レビューや修正の際に、Claudeへそのまま渡す差分の最大行数です。これを超える場合は変更ファイルの一覧だけを渡し、詳細はClaude自身に読み取らせます。
      default: 3000
    factory_branch:
      type: string
      description: >-
        自分自身を最新化する処理が追跡するリポジトリのブランチ名です。
      default: main
    factory_repo:
      type: string
      description: >-
        このSoftware Factory自身のリポジトリのURLです。自分自身を最新化する処理の対象になります。
      format: uri
    factory_repo_id:
      type: integer
      minimum: 1
      description: >-
        `factory_repo`のGitHubリポジトリの数値IDです。指定すると、Factory自身のリポジトリを使う処理が取得の前にGitHubの現在のIDと照合し、食い違うときは取得しません。オーナーが改名して別の人がその名前を取得した場合に、その人のリポジトリを使わないためです。省略すると名前だけで取得します。
    fix_label:
      type: string
      description: このラベルが付いたPRは修正処理の対象になります。
      default: factory:fix
    heavy_model:
      type: string
      description: >-
        要件定義の生成、PRのレビュー、監査と、実装やPR修正で`model`が2回失敗した後に使うClaude Codeのモデル名です。判断が重い作業に使います。
      default: claude-opus-5-5
    implement_check_timeout_sec:
      type: integer
      description: >-
        実装(工程3)で検査コマンド1件を打ち切るまでの制限時間(秒)。フロー全体の期限を過ぎても、検査はこの時間まで走らせます。
      default: 900
    implement_enabled:
      type: boolean
      description: >-
        要件定義の承認後に実装(工程3)を自動で開始するかどうかです。falseの間は従来どおり`approved`で止まります。
      default: false
    implement_flow_timeout_sec:
      type: integer
      description: >-
        実装(工程3)の1回の実行の期限(秒)。作業領域の準備を始めてから数えます。検査に失敗した後、期限までの残りが修正1回分の最悪の所要時間に足りなければ、修正をやめて対応が必要な状態(needs_human)にします。Claude Codeの実行はこの残りで打ち切ります。検査コマンドは打ち切りません。implement_timeout_sec・implement_check_timeout_sec・検査コマンド数との組み合わせが実装フローのステップのtimeout(21600秒)に収まらないと、実装の準備でneeds_humanになります。
      default: 14400
    implement_max_budget_usd_per_run:
      type: number
      description: 実装(工程3)におけるClaude Codeの1回の実行あたりの利用上限(USD)。
      default: 10
    implement_max_changed_files:
      type: integer
      description: >-
        実装(工程3)で変更してよいファイル数の上限です。これを超える差分は対応が必要な状態(needs_human)にします。
      default: 60
    implement_max_diff_lines:
      type: integer
      description: >-
        実装(工程3)で変更してよい行数(追加+削除)の上限です。これを超える差分は対応が必要な状態(needs_human)にします。
      default: 3000
    implement_max_rounds:
      type: integer
      description: >-
        実装(工程3)で検査と修正を繰り返す最大回数です(最初の実装1回+修正)。超えると対応が必要な状態(needs_human)にします。
      default: 5
    implement_max_turns:
      type: integer
      description: 実装(工程3)におけるClaude Codeの1回の実行あたりの最大ターン数。
      default: 80
    implement_timeout_sec:
      type: integer
      description: 実装(工程3)におけるClaude Codeの1回の実行を打ち切るまでの制限時間(秒)。
      default: 3600
    instance_name:
      type: string
      description: >-
        このインスタンスを識別するための名前です。Discord通知やIssueへのコメントに表示され、複数のインスタンスを運用している場合に区別できるようにします。
    max_attempts:
      type: integer
      description: >-
        要件定義の再生成を試みる最大回数です。超えると対応が必要な状態(needs_human)にします。
      default: 3
    max_budget_usd_per_run:
      type: number
      description: 1回の自動処理あたりのClaude利用上限(USD)。
      default: 5
    max_fix_changed_files:
      type: integer
      description: >-
        1回の修正で変更してよいファイル数の上限です。これを超える差分は自動での適用には大きすぎると判断し、対応が必要な状態(needs_human)にします。
      default: 30
    max_fix_diff_lines:
      type: integer
      description: >-
        1回の修正で変更してよい行数(追加+削除)の上限です。これを超える差分は自動での適用には大きすぎると判断し、対応が必要な状態(needs_human)にします。
      default: 1500
    max_fix_rounds:
      type: integer
      description: >-
        1つのPRに対して修正を試みる最大回数です。超えると対応が必要な状態(needs_human)にします。
      default: 3
    max_lookback_days:
      type: integer
      description: >-
        週次監査(工程5)が1回に遡る日数の上限です。前回の監査が失敗するなどして前回レポートの終端が古い場合でも、この日数より前は監査対象にしません。
      default: 28
    max_turns:
      type: integer
      description: 1回の自動処理でClaudeがやり取りできる最大ターン数。
      default: 40
    model:
      type: string
      description: >-
        実装とPR修正など、安く直せる作業で使うClaude Codeのモデル名です。同じ作業で2回失敗すると`heavy_model`に切り替わります。
      default: claude-sonnet-5-5
    owners:
      type: array
      description: >-
        この処理が巡回する対象のGitHubアカウントの一覧です。それぞれ`kind`で個人アカウントか組織かを指定します。
      items:
        type: object
        order:
          - name
          - kind
          - id
        properties:
          name:
            type: string
            description: GitHubのユーザーまたは組織のログイン名。
          id:
            type: integer
            minimum: 1
            description: >-
              GitHubのアカウントの数値IDです。指定すると、検索の前にGitHubの現在のIDと照合し、食い違うオーナーは検索を飛ばします。作業項目を進める準備のステップも、リポジトリを取得する前に、リポジトリのオーナーのIDを照合します。オーナーが改名して別の人がその名前を取得した場合に、その人のIssueとPRを検索の候補に入れず、保存済みの作業項目も進めないためです。省略すると名前だけで照合します。
          kind:
            type: string
            description: userなら個人アカウント、orgなら組織を指定します。
            enum:
              - user
              - org
        required:
          - name
          - kind
    pr_ci_fix_enabled:
      type: boolean
      description: >-
        FactoryのPRのCIの失敗を直す作業項目を、watch_pr_ciが起動してよいかを表す値です。falseの間は何も起動しません。trueにするには、pr_ci_fix_enabled_sinceも書きます。
      default: false
    pr_ci_fix_enabled_since:
      type: string
      format: date-time
      description: >-
        秒まで書いたタイムゾーン付きのRFC 3339の日時です(例: 2026-10-13T03:00:00Z)。書き損じると、設定の読み込みが失敗します。指定すると、CIの記録の最初に見た時刻(first_seen_at)がこの時刻より前の失敗は、直す対象にしません。有効にした時点で判定待ちだった失敗も、見つけた時刻が前なら対象外です。pr_ci_fix_enabledがtrueのときは省略できません。
    pr_ci_fix_max_rounds:
      type: integer
      minimum: 1
      maximum: 10
      description: >-
        1つのPRで、CIの失敗を直すラウンドを起動できる回数の上限です。直近に通ったコミットより後のラウンドを数え、通ると数え直します。1以上10以下の整数にします。
      default: 2
    pr_conflict_watch_enabled:
      type: boolean
      description: >-
        FactoryのPRのマージの競合を検知して、通知するかどうかです。検知と通知だけで、PRにもリポジトリにも書き込みません。falseの間は、`watch_pr_conflicts`はGitHubもDBも読まず、何も書きません。pr_ci_watch_enabledには依りません。
      default: false
    worker_alert_memory_ratio:
      type: number
      exclusiveMinimum: 0
      maximum: 1
      description: >-
        defaultのworkerのメモリの通知を出す割合です。最新の記録でanonのメモリが上限のこの割合以上になると、通知します。0を超え1以下の数にします。
      default: 0.8
    pr_ci_watch_enabled:
      type: boolean
      description: >-
        FactoryのPRのCIを観測して、失敗を通知するかどうかです。観測と通知だけで、PRにもリポジトリにも書き込みません。falseにすると、`watch_pr_ci`は発見と判定と失敗の通知をしません。失敗を直す作業項目が終わった行を戻す回復だけは、行があれば動きます。回復はオーナーの照合を行わず、設定に合うリポジトリのPRを読みます。照合に伴う通知は足しませんが、PRを読めず403か404になると、権限の不足の通知は足すことがあります。判定が動かない間は、この通知は解決されません。
      default: true
    pr_ci_watch_human_prs:
      type: boolean
      description: >-
        許可された人が作ったPRのCIの失敗も通知するかどうかです。通知だけで、直す作業項目は起動しません。許可された人は、PATのアカウントと`allowed_labeler_logins`のアカウントです。開いていて、下書きでなく、forkでなく、Factoryが作っていないPRだけを対象にします。trueにする前に、通知先と対象のアカウントを確かめてください。pr_ci_watch_enabledがfalseのときは、発見も通知もしません。
      default: false
    repo_allowlist:
      type: array
      description: >-
        この処理が操作してよいリポジトリのURLです。空の場合は、ownersに含まれるリポジトリすべてを対象にします。factory_repoはこの一覧に関わらず常に対象です。
      default: []
      items:
        type: string
    retention_logs_days:
      type: integer
      description: >-
        失敗記録・デプロイ記録・解決済みのお知らせを保持する日数です。この日数を過ぎると自動的に削除されます。
      default: 30
    retention_work_items_days:
      type: integer
      description: >-
        終端状態(承認済み・要対応・タイムアウト・失敗・レビュー済み・再レビュー依頼・ブロック・監査完了・PR作成済み・キャンセル)になった作業項目を保持する日数です。この日数を過ぎると、関連する要件定義ドラフトや承認依頼もあわせて自動的に削除されます。
      default: 90
    review_label:
      type: string
      description: このラベルが付いたPRはレビュー処理の対象になります。
      default: factory:review
    review_post_mode:
      type: string
      description: >-
        レビュー結果の投稿方法です。`gated`は今後の機能のために予約された値で、現時点では未実装です。
      default: comment_only
      enum:
        - comment_only
        - gated
    tracked_pr_days:
      type: integer
      description: >-
        PRのトリガーラベル(review / fix)を消費した後もそのPRを追跡対象として扱う日数です。この日数のあいだに作業項目が更新されていれば、ラベルが外れていても再レビュー・再修正の対象として再発見します。過ぎると追跡から外れ、人が改めてラベルを付け直すまで対象になりません。
      default: 30
    trigger_label:
      type: string
      description: このラベルが付いたIssueが処理対象になります。
      default: factory
    windmill_public_url:
      type: string
      description: >-
        通知に含める承認リンクなどを組み立てる際に使う、このインスタンスの公開URLです。
      default: http://127.0.0.1:8080
      format: uri
    worktree_ttl_days:
      type: integer
      description: >-
        処理が終わった作業用ディレクトリを保持する日数です。この日数を過ぎると自動的に削除されます。
      default: 7
  required:
    - owners
    - trigger_label
    - allowed_labeler_associations
    - model
    - max_attempts
    - max_turns
    - max_budget_usd_per_run
    - daily_budget_usd
    - claude_timeout_sec
    - worktree_ttl_days
    - factory_repo
    - instance_name
    - windmill_public_url
