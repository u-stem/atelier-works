description: 'Software Factory runtime configuration: who owns triggered repos,
  label names, Claude Code execution limits/budget, and instance identity.'
format_extension: null
is_fileset: false
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - owners
    - trigger_label
    - wip_label
    - approved_label
    - allowed_labeler_associations
    - model
    - max_attempts
    - max_turns
    - max_budget_usd_per_run
    - daily_budget_usd
    - claude_timeout_sec
    - worktree_ttl_days
    - factory_repo
    - instance_name
    - windmill_public_url
    - review_label
    - fix_label
    - pr_label
    - review_post_mode
    - max_fix_rounds
    - allowed_check_commands
    - default_reviewers
    - repo_allowlist
    - diff_max_lines
    - max_fix_changed_files
    - max_fix_diff_lines
  properties:
    allowed_check_commands:
      type: array
      description: Shell commands pr_fix.flow may run (via `env -i`, no secrets, with a
        timeout) to check a repo's standard checks before a second Claude Code run, e.g.
        ["mise run check"]. Empty means no check command is run.
      default: []
      items:
        type: string
    allowed_labeler_associations:
      type: array
      description: GitHub author_association values allowed to apply trigger_label for
        the issue to be picked up.
      default:
        - OWNER
        - MEMBER
        - COLLABORATOR
      items:
        type: string
        enum:
          - OWNER
          - MEMBER
          - COLLABORATOR
    approved_label:
      type: string
      description: Label applied once requirements are approved.
      default: factory:approved
    claude_timeout_sec:
      type: integer
      description: Subprocess timeout in seconds for a single Claude Code invocation.
      default: 1800
    daily_budget_usd:
      type: number
      description: Daily USD budget across all agent runs before new runs are refused.
      default: 50
    default_reviewers:
      type: array
      description: GitHub logins requested as reviewers on a pull request pr_fix.flow
        just pushed to. Empty means keep the PR's existing reviewers.
      default: []
      items:
        type: string
    diff_max_lines:
      type: integer
      description: Max diff lines passed inline to a review/fix Claude Code prompt;
        beyond this only the changed-file list is passed and Claude reads the rest itself.
      default: 3000
    factory_repo:
      type: string
      description: HTTPS clone URL of this factory repository (self-update target).
      format: uri
    fix_label:
      type: string
      description: Label that hands a pull request to pr_fix.flow.
      default: factory:fix
    instance_name:
      type: string
      description: Label for this Windmill instance, shown in Discord notices and
        Issue comments so multiple instances can be told apart.
    max_attempts:
      type: integer
      description: Maximum requirement-generation attempts before falling back to
        needs_human.
      default: 3
    max_budget_usd_per_run:
      type: number
      description: Max USD budget passed to `claude -p --max-budget-usd` per stage run.
      default: 5
    max_fix_changed_files:
      type: integer
      description: Max changed files allowed in one pr_fix_verify diff before it is
        treated as too large to auto-apply and falls back to needs_human.
      default: 30
    max_fix_diff_lines:
      type: integer
      description: Max diff lines (additions + deletions combined) allowed in one
        pr_fix_verify diff before it is treated as too large to auto-apply and falls
        back to needs_human.
      default: 1500
    max_fix_rounds:
      type: integer
      description: Max pr_fix.flow rounds for one pull request before falling back to
        needs_human.
      default: 3
    max_turns:
      type: integer
      description: Max turns passed to `claude -p --max-turns` per stage run.
      default: 40
    model:
      type: string
      description: Claude Code model used for factory stages.
      default: claude-opus-5-5
    owners:
      type: array
      description: Accounts whose repos the factory is allowed to poll for triggered issues.
      items:
        type: object
        order:
          - name
          - kind
        properties:
          name:
            type: string
            description: GitHub login of the user or organization.
          kind:
            type: string
            description: Whether the owner is a personal account or an organization.
            enum:
              - user
              - org
        required:
          - name
          - kind
    pr_label:
      type: string
      description: Label applied to a pull request the factory itself opened, so
        pr_review.flow knows to pass it the PR's approved requirements.
      default: factory:pr
    repo_allowlist:
      type: array
      description: HTTPS clone URLs of repos the factory is allowed to act on. Empty
        means no restriction beyond owners.
      default: []
      items:
        type: string
    review_label:
      type: string
      description: Label that hands a pull request to pr_review.flow.
      default: factory:review
    review_post_mode:
      type: string
      description: How pr_review.flow posts its review. "gated" is reserved for a
        future cycle and not yet implemented.
      default: comment_only
      enum:
        - comment_only
        - gated
    trigger_label:
      type: string
      description: Issue label that hands an issue to the factory.
      default: factory
    windmill_public_url:
      type: string
      description: Base URL used to build resume/approval links in notifications.
      default: http://127.0.0.1:8080
      format: uri
    wip_label:
      type: string
      description: Label applied while an instance has claimed an issue.
      default: factory:wip
    worktree_ttl_days:
      type: integer
      description: Days a terminal-status worktree is kept before cleanup_workspaces
        removes it.
      default: 7
  required:
    - owners
    - trigger_label
    - wip_label
    - approved_label
    - allowed_labeler_associations
    - model
    - max_attempts
    - max_turns
    - max_budget_usd_per_run
    - daily_budget_usd
    - claude_timeout_sec
    - worktree_ttl_days
    - factory_repo
    - instance_name
    - windmill_public_url
