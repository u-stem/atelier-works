description: >-
  Software Factory の実行時設定。対象リポジトリの所有者、ラベル名、Claude
  Code の実行上限・予算、インスタンス識別情報を持つ。
format_extension: null
is_fileset: false
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - owners
    - trigger_label
    - wip_label
    - approved_label
    - allowed_labeler_associations
    - model
    - max_attempts
    - max_turns
    - max_budget_usd_per_run
    - daily_budget_usd
    - claude_timeout_sec
    - worktree_ttl_days
    - factory_repo
    - instance_name
    - windmill_public_url
    - review_label
    - fix_label
    - pr_label
    - review_post_mode
    - max_fix_rounds
    - allowed_check_commands
    - default_reviewers
    - repo_allowlist
    - diff_max_lines
    - max_fix_changed_files
    - max_fix_diff_lines
  properties:
    allowed_check_commands:
      type: array
      description: >-
        `pr_fix__flow` が(`env -i` 経由、秘密情報なし、タイムアウト付きで)
        実行してよいシェルコマンド。2回目の Claude Code 実行前にリポジトリの
        標準チェックを走らせる(例: `["mise run check"]`)。空配列ならチェック
        コマンドは実行しない。
      default: []
      items:
        type: string
    allowed_labeler_associations:
      type: array
      description: >-
        `trigger_label` を付けて Issue を拾わせることを許可する GitHub の
        author_association。
      default:
        - OWNER
        - MEMBER
        - COLLABORATOR
      items:
        type: string
        enum:
          - OWNER
          - MEMBER
          - COLLABORATOR
    approved_label:
      type: string
      description: 要件定義が承認されたときに付与するラベル。
      default: factory:approved
    claude_timeout_sec:
      type: integer
      description: Claude Code を1回実行する際のサブプロセスタイムアウト(秒)。
      default: 1800
    daily_budget_usd:
      type: number
      description: >-
        全 agent run 合計の1日あたりの USD 予算上限。超過すると新規実行を
        拒否する。
      default: 50
    default_reviewers:
      type: array
      description: >-
        `pr_fix__flow` が push した直後の PR にレビュワーとして指定する
        GitHub ログイン名。空なら PR の既存レビュワーをそのまま使う。
      default: []
      items:
        type: string
    diff_max_lines:
      type: integer
      description: >-
        レビュー/修正の Claude Code プロンプトにインラインで渡す差分の最大
        行数。これを超えると変更ファイル一覧のみを渡し、残りは Claude 自身に
        読ませる。
      default: 3000
    factory_repo:
      type: string
      description: この factory リポジトリ自身の HTTPS clone URL(self_update の対象)。
      format: uri
    fix_label:
      type: string
      description: PR を `pr_fix__flow` に渡すラベル。
      default: factory:fix
    instance_name:
      type: string
      description: >-
        この Windmill インスタンスを識別する名前。Discord 通知や Issue
        コメントに表示され、複数インスタンスを区別できるようにする。
    max_attempts:
      type: integer
      description: >-
        要件定義の再生成を試みる最大回数。超えると `needs_human` へ
        フォールバックする。
      default: 3
    max_budget_usd_per_run:
      type: number
      description: 各ステージの `claude -p --max-budget-usd` に渡す1回あたりの USD 予算上限。
      default: 5
    max_fix_changed_files:
      type: integer
      description: >-
        `pr_fix_verify` の差分に含めてよい変更ファイル数の上限。超えると
        自動適用には大きすぎると判断し `needs_human` へフォールバックする。
      default: 30
    max_fix_diff_lines:
      type: integer
      description: >-
        `pr_fix_verify` の差分に含めてよい変更行数(追加+削除)の上限。
        超えると自動適用には大きすぎると判断し `needs_human` へ
        フォールバックする。
      default: 1500
    max_fix_rounds:
      type: integer
      description: >-
        1つの PR に対する `pr_fix__flow` の最大試行回数。超えると
        `needs_human` へフォールバックする。
      default: 3
    max_turns:
      type: integer
      description: 各ステージの `claude -p --max-turns` に渡す最大ターン数。
      default: 40
    model:
      type: string
      description: factory の各ステージで使用する Claude Code のモデル。
      default: claude-opus-5-5
    owners:
      type: array
      description: 巡回対象の GitHub アカウント。`kind` は user または org。
      items:
        type: object
        order:
          - name
          - kind
        properties:
          name:
            type: string
            description: GitHub のユーザーまたは組織のログイン名。
          kind:
            type: string
            description: 個人アカウントか組織かの区別。
            enum:
              - user
              - org
        required:
          - name
          - kind
    pr_label:
      type: string
      description: >-
        factory 自身が作成した PR に付与するラベル。`pr_review__flow` が
        このラベルを見て、承認済み要件定義を渡すべき PR だと判断する。
      default: factory:pr
    repo_allowlist:
      type: array
      description: >-
        factory が操作してよいリポジトリの HTTPS clone URL。空なら owners
        以外の制限は無い。
      default: []
      items:
        type: string
    review_label:
      type: string
      description: PR を `pr_review__flow` に渡すラベル。
      default: factory:review
    review_post_mode:
      type: string
      description: >-
        `pr_review__flow` がレビューを投稿する方式。`gated` は将来のサイクル
        向けの予約値で未実装。
      default: comment_only
      enum:
        - comment_only
        - gated
    trigger_label:
      type: string
      description: Issue を factory に渡すラベル。
      default: factory
    windmill_public_url:
      type: string
      description: 通知内の resume / 承認リンクを組み立てる際に使うベース URL。
      default: http://127.0.0.1:8080
      format: uri
    wip_label:
      type: string
      description: インスタンスが Issue / PR を claim している間に付与するラベル。
      default: factory:wip
    worktree_ttl_days:
      type: integer
      description: >-
        終端状態の worktree を `cleanup_workspaces` が削除するまで保持する
        日数。
      default: 7
  required:
    - owners
    - trigger_label
    - wip_label
    - approved_label
    - allowed_labeler_associations
    - model
    - max_attempts
    - max_turns
    - max_budget_usd_per_run
    - daily_budget_usd
    - claude_timeout_sec
    - worktree_ttl_days
    - factory_repo
    - instance_name
    - windmill_public_url
