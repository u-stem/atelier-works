# `mise.toml`の`setup`タスク(`lefthook install`)で導入する。
# `--no-verify`で飛ばさない(AGENTS.mdを参照)。
# どのコマンドも`mise exec --`を通す。コミットする人のシェルでmiseが
# 有効でなくても動くようにするため(PATHに`mise`があればよい)。
pre-commit:
  # wmill-metadataは並列のグループに入れず、先に単独で実行する。
  # ステージしたロックやスキーマのファイルを、gitleaksがステージ内容を走査し
  # wmill-lintが`f/`を検査する前にディスクへ揃えておくため。
  jobs:
    - name: wmill-metadata
      glob: "f/**"
      tags:
        - wmill-metadata
      run: mise exec -- scripts/generate-metadata-staged.sh
    - group:
        parallel: true
        jobs:
          - name: biome
            glob: "*.{ts,tsx,js,css,json,jsonc}"
            run: mise exec -- bunx --bun biome check --no-errors-on-unmatched {staged_files}
          - name: no-type-assertions
            glob: "*.{ts,tsx}"
            run: mise exec -- bun run scripts/lint-no-type-assertions.ts {staged_files}
          - name: no-section-sign
            glob: "*.{ts,tsx,js,mjs,sh,yaml,yml,toml,sql}"
            run: mise exec -- bun run scripts/lint-no-section-sign.ts {staged_files}
          - name: gitleaks
            run: mise exec -- gitleaks protect --staged --redact --no-banner
          - name: wmill-lint
            glob: "f/**"
            run: mise exec -- wmill lint f

commit-msg:
  commands:
    check-message:
      run: scripts/check-commit-msg.sh {1}

pre-push:
  commands:
    check:
      run: mise run check
    # pre-commitのwmill-metadataの取りこぼしを止める。pushするコミットが
    # Windmillの資産かハッシュのファイルに触れるときだけ動くので、
    # 文書だけのpushにローカルのWindmillは要らない。緊急時は
    # `LEFTHOOK_EXCLUDE=wmill-metadata-check`で飛ばせる
    # (その場合は次のpushの前に`mise run metadata`を実行する)。
    wmill-metadata-check:
      glob:
        - "f/**"
        - "wmill-lock.yaml"
      run: mise run metadata:check
