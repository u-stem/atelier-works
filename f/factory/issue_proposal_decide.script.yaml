summary: '[OP-3-1] Issue化提案の承認 / 却下'
description: pr_fixがレビュー指摘に対して提案したIssue化(Issue title /
  body)を承認または却下します。承認するとIssueが作成され、レビュースレッドに起票結果を返信します。却下すると理由を返信し、スレッドは開いたままになります。
lock: '!inline f/factory/issue_proposal_decide.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    decision:
      type: string
      description: approve = Issueを起票する、reject = 見送る
      default: null
      originalType: string
    proposal_id:
      type: number
      description: 承認または却下の対象となるIssue化提案のID。ConsoleのInboxに記載されています。
      default: null
    reason:
      type: string
      description: 却下する理由。承認する場合は空でも構いません。
      default: null
      originalType: string
    with_factory_label:
      type: boolean
      description: 承認時、作成したIssueにfactoryのトリガーラベルを付けて要件定義工程に乗せるかどうか。却下時は無視されます。
      default: null
  required:
    - proposal_id
    - decision
    - reason
    - with_factory_label
