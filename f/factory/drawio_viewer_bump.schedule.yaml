summary: '[SYS-8] draw.ioのビューアの固定を最新化'
description: >-
  毎週月曜の10:00に実行します。draw.ioの公式のリリースを確かめ、公開から14日以上たった、今と同じメジャー版の最新に固定(`console/drawio-viewer.json`)を上げるPRを作ります。PRには自動レビューのラベルを付けます。未完了の更新のPRがあるあいだと、同じ版のPRを作った後は、何もしません。メジャー版が違う版と、ビューアの大きさが2割を超えて変わる版は上げず、お知らせに残します。
args: {}
cron_version: v2
enabled: true
is_flow: false
no_flow_overlap: true
on_failure: f/factory/on_error_schedule
schedule: 0 0 10 * * 1
script_path: f/factory/drawio_viewer_bump
timezone: Asia/Tokyo
ws_error_handler_muted: false
