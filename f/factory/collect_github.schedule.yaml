summary: '[SYS-11] GitHubのリポジトリの状態を集める'
description: >-
  5分ごとに実行します。設定のownersの所有者ごとに、読み取り専用のトークンでリポジトリの一覧と、開いているPRとトリガーラベル付きのIssueの件数を集めて、DBに書きます。設定のgh_collect_enabledがfalseの間は、トークンを読まず、何も書きません。毎日9時0分の日次サマリ通知と重ならないよう、毎時1分から5分おきに実行します。
args: {}
cron_version: v2
enabled: true
is_flow: false
no_flow_overlap: true
on_failure: f/factory/on_error_schedule
schedule: 0 1-59/5 * * * *
script_path: f/factory/collect_github
timezone: Asia/Tokyo
ws_error_handler_muted: false
