summary: '[SYS-10] GitHubの一時的な失敗で止まったPRレビューを再開'
description: 5分ごとに実行し、GitHubの5xxや通信断で失敗したPRレビュー(failed)を、失敗から再開の回数に応じた待ち(5分、15分、45分)が過ぎていれば再開します。理由と回数を条件にした比較と交換で、ラベルを付け直さずに再開し、同じ作業項目の自動の再開は3回までです。使い切ったときの通知は、失敗を記録した側が出します。待ちを過ぎても再開されないものは、この巡回が人に知らせます。
