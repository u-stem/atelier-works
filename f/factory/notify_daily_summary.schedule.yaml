summary: '[SYS-3] 日次サマリ通知'
description: >-
  毎日9:00(Asia/Tokyo)に実行します。前日分の実行回数・コスト・失敗回数と承認/却下の件数、workerの負荷を集計し、Discordへ日次サマリを投稿します。`review_post_mode`が`gated`のときは、レビューの投稿欄を足し、投稿しない状態が3日以上続けばConsoleの要対応にnoticeを追加し、投稿するモードに戻れば解決します。予定が飛んだ日があれば、最後に出した日の翌日から古い順に、最大7日分まで出します。
args: {}
cron_version: v2
enabled: true
is_flow: false
no_flow_overlap: true
schedule: 0 0 9 * * *
script_path: f/factory/notify_daily_summary
timezone: Asia/Tokyo
ws_error_handler_muted: false
