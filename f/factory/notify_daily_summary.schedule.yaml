summary: '[SYS-3] 日次サマリ通知'
description: >-
  前日分の agent_runs(件数・コスト・失敗)と approvals(承認/却下件数)を
  集計し、Discord へ日次サマリの embed を投稿する(docs/architecture.md
  参照)。
args: {}
cron_version: v2
enabled: true
is_flow: false
no_flow_overlap: true
on_failure: f/factory/on_error_schedule
schedule: 0 0 9 * * *
script_path: f/factory/notify_daily_summary
timezone: Asia/Tokyo
ws_error_handler_muted: false
