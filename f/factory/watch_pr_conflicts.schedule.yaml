summary: '[SF-4-3] PRの競合を検知して通知'
description: >-
  5分ごとに実行します。Factoryが作ったPRにマージの競合があるかを調べ、競合したPRは要対応の通知とDiscordで知らせます。競合が解けたら通知を自動で解決し、閉じたPRの記録は整理します。設定で有効にしたときだけ動き、無効のときはGitHubもDBも読みません。PRには書き込みません。競合を直す設定が有効なときは、通知の前に、競合を直す作業項目を起動します。競合を直す作業項目が結ばれた行を戻す回復は、競合を直す設定に依らず、毎回行います。
args: {}
cron_version: v2
enabled: true
is_flow: false
no_flow_overlap: true
schedule: 30 */5 * * * *
script_path: f/factory/watch_pr_conflicts
timezone: Asia/Tokyo
ws_error_handler_muted: false
