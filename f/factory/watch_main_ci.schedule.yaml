summary: '[SF-4-1] mainのCIを監視して失敗を通知'
description: >-
  5分ごとに実行します。対象リポジトリの既定のブランチ(main)へのpushで動いたGitHub Actionsの結果をコミット単位で判定します。失敗したコミットは要対応の通知とDiscordで知らせ、同じリポジトリの新しいコミットが通ったら失敗の通知を自動で解決します。実行を読む権限が無いリポジトリは、権限の不足を通知します。
args: {}
cron_version: v2
enabled: true
is_flow: false
no_flow_overlap: true
schedule: 0 */5 * * * *
script_path: f/factory/watch_main_ci
timezone: Asia/Tokyo
ws_error_handler_muted: false
