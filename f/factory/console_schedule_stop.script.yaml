summary: '[OP-2-10] scheduleを止める'
description: Factory
  Consoleから、凍結を置いたscheduleを1件、無効にします。止められるのは、名前で列挙したscheduleだけです。凍結を置いてから7分が過ぎていて、自己更新(self_update)が置く前から実行中でないときだけ止めます。凍結が無いとき、ローカルのセッションが置いた凍結のときは止めません。操作の前に記録を残し、残せなければ止めません。止めた後に読み直して返します。有効に戻す操作は持ちません。
