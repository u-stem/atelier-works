summary: '[SF-3-1] PR の自動レビュー'
description: >-
  依頼されたPRをレビューします。PRの内容をもとにClaudeがレビューを生成し、GitHubのPRへコメントとして投稿します。結果は記録され、Discordに通知されます。
value:
  modules:
    - id: pr_review_prepare
      summary: '[SF-3-1/1] PR の取得と検証'
      value:
        type: script
        input_transforms:
          work_item_id:
            type: javascript
            expr: flow_input.work_item_id
        path: f/factory/steps/pr_review_prepare
    - id: pr_review_generate
      summary: '[SF-3-1/2] レビューの生成(Claude)'
      value:
        type: script
        input_transforms:
          attempt:
            type: javascript
            expr: results.pr_review_prepare.attempt
          factory_clone_dir:
            type: javascript
            expr: results.pr_review_prepare.factory_clone_dir
          owner:
            type: javascript
            expr: results.pr_review_prepare.owner
          parent_work_item_id:
            type: javascript
            expr: results.pr_review_prepare.parent_work_item_id
          pr_number:
            type: javascript
            expr: results.pr_review_prepare.pr_number
          repo:
            type: javascript
            expr: results.pr_review_prepare.repo
          review_sha:
            type: javascript
            expr: results.pr_review_prepare.review_sha
          skip:
            type: javascript
            expr: results.pr_review_prepare.skip
          work_item_id:
            type: javascript
            expr: flow_input.work_item_id
          worktree_dir:
            type: javascript
            expr: results.pr_review_prepare.worktree_dir
        path: f/factory/steps/pr_review_generate
      retry:
        exponential:
          attempts: 2
          multiplier: 4
          random_factor: 0
          seconds: 30
      skip_if:
        expr: results.pr_review_prepare.skip === true
    - id: pr_review_post
      summary: '[SF-3-1/3] レビューの投稿'
      value:
        type: script
        input_transforms:
          summary:
            type: javascript
            expr: results.pr_review_generate?.summary ?? ""
          findings:
            type: javascript
            expr: results.pr_review_generate?.findings ?? []
          owner:
            type: javascript
            expr: results.pr_review_prepare.owner
          pr_files:
            type: javascript
            expr: results.pr_review_generate?.pr_files ?? []
          pr_number:
            type: javascript
            expr: results.pr_review_prepare.pr_number
          repo:
            type: javascript
            expr: results.pr_review_prepare.repo
          repo_dir:
            type: javascript
            expr: results.pr_review_prepare.repo_dir
          review_sha:
            type: javascript
            expr: results.pr_review_prepare.review_sha
          skip:
            type: javascript
            expr: results.pr_review_prepare.skip
          verdict:
            type: javascript
            expr: results.pr_review_generate?.verdict ?? null
          work_item_id:
            type: javascript
            expr: flow_input.work_item_id
          worktree_dir:
            type: javascript
            expr: results.pr_review_prepare.worktree_dir
        path: f/factory/steps/pr_review_post
      skip_if:
        expr: results.pr_review_prepare.skip === true
  failure_module:
    id: failure
    value:
      type: script
      input_transforms:
        error:
          type: javascript
          expr: error
        path:
          type: static
          value: f/factory/pr_review
        work_item_id:
          type: javascript
          expr: flow_input.work_item_id
      path: f/factory/on_error_flow
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - work_item_id
  properties:
    work_item_id:
      type: integer
      description: >-
        レビュー処理の対象となる作業項目のID。GitHub Issueのコメントや、Discordの通知に記載されています。
  required:
    - work_item_id
