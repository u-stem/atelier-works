summary: '[SYS-12] バックアップを取る'
description: >-
  毎日2:30(Asia/Tokyo)に実行します。Postgresのクラスタ全体、factory_stateのvolume、参照を伏せたfactory_configを、/var/lib/factory-backupsの新しい世代に控えます。作業領域の掃除(3:00)とDBの掃除(3:30)の前に動き、掃除の前の状態を残します。新しい方からbackup_keep_generations(既定7)の世代を残し、古い世代を消します。失敗すると要対応の通知(backup_failed)を残し、ジョブを失敗にします。成功したときは通知しません。
args: {}
cron_version: v2
enabled: true
is_flow: false
no_flow_overlap: true
schedule: 0 30 2 * * *
script_path: f/factory/backup
timezone: Asia/Tokyo
ws_error_handler_muted: false
