summary: '[OP-1-1] 手動投入フォーム(Issue を作成して工程に乗せる)'
description: >-
  フォームから手動でタスクを投入する。`.github/ISSUE_TEMPLATE/factory-task.yml`
  と同じ Markdown 構成でトリガー Issue を作成し、`poll_issues` と同じ手順で
  claim したうえで `pipeline__flow` を起動する(docs/architecture.md 参照)。
value:
  modules:
    - id: create_issue
      summary: '[OP-1-1/1] Issue を作成'
      value:
        type: script
        input_transforms:
          acceptance_criteria:
            type: javascript
            expr: flow_input.acceptance_criteria
          body:
            type: javascript
            expr: flow_input.body
          owner:
            type: javascript
            expr: flow_input.owner
          repo:
            type: javascript
            expr: flow_input.repo
          title:
            type: javascript
            expr: flow_input.title
        path: f/factory/steps/manual_intake_create_issue
    - id: register
      summary: '[OP-1-1/2] 作業項目を登録して工程 2 を起動'
      value:
        type: script
        input_transforms:
          body:
            type: javascript
            expr: results.create_issue.body
          issue_number:
            type: javascript
            expr: results.create_issue.number
          issue_url:
            type: javascript
            expr: results.create_issue.htmlUrl
          owner:
            type: javascript
            expr: results.create_issue.owner
          repo:
            type: javascript
            expr: results.create_issue.repo
          title:
            type: javascript
            expr: results.create_issue.title
        path: f/factory/steps/manual_intake_register
  failure_module:
    id: failure
    value:
      type: script
      input_transforms:
        error:
          type: javascript
          expr: error.message
        path:
          type: static
          value: f/factory/manual_intake
      path: f/factory/on_error_flow
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - owner
    - repo
    - title
    - body
    - acceptance_criteria
  properties:
    acceptance_criteria:
      type: string
      description: 受入基準(acceptance criteria), one per line. Optional.
      default: ''
    body:
      type: string
      description: 目的(purpose) — what this task should achieve.
    owner:
      type: string
      description: GitHub owner (user or org) of the target repository.
    repo:
      type: string
      description: GitHub repository name.
    title:
      type: string
      description: Issue title.
  required:
    - owner
    - repo
    - title
    - body
