summary: '[OP-1-1] 手動投入フォーム(Issueを作成して工程に乗せる)'
description: >-
  手動でタスクを投入するためのフォームです。入力内容をもとにGitHub Issueを作成し、担当を確定したうえで要件定義の生成を開始します。
value:
  modules:
    - id: create_issue
      summary: '[OP-1-1/1] Issue を作成'
      value:
        type: script
        input_transforms:
          acceptance_criteria:
            type: javascript
            expr: flow_input.acceptance_criteria
          body:
            type: javascript
            expr: flow_input.body
          owner:
            type: javascript
            expr: flow_input.owner
          repo:
            type: javascript
            expr: flow_input.repo
          title:
            type: javascript
            expr: flow_input.title
        path: f/factory/steps/manual_intake_create_issue
    - id: register
      summary: '[OP-1-1/2] 作業項目を登録して工程 2 を起動'
      value:
        type: script
        input_transforms:
          body:
            type: javascript
            expr: results.create_issue.body
          issue_number:
            type: javascript
            expr: results.create_issue.number
          issue_url:
            type: javascript
            expr: results.create_issue.htmlUrl
          owner:
            type: javascript
            expr: results.create_issue.owner
          repo:
            type: javascript
            expr: results.create_issue.repo
          title:
            type: javascript
            expr: results.create_issue.title
        path: f/factory/steps/manual_intake_register
  failure_module:
    id: failure
    value:
      type: script
      input_transforms:
        error:
          type: javascript
          expr: error.message
        path:
          type: static
          value: f/factory/manual_intake
      path: f/factory/on_error_flow
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - owner
    - repo
    - title
    - body
    - acceptance_criteria
  properties:
    acceptance_criteria:
      type: string
      description: 受入基準。1行につき1項目で入力してください(任意)。
      default: ''
    body:
      type: string
      description: このタスクで達成したい目的。
    owner:
      type: string
      description: 対象リポジトリを所有するGitHubのユーザー名または組織名。
    repo:
      type: string
      description: 対象リポジトリ名。
    title:
      type: string
      description: 作成するIssueのタイトル。
  required:
    - owner
    - repo
    - title
    - body
