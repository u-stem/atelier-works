summary: '[SF-1-1] Issueを巡回して担当を確定'
description: >-
  5分ごとに実行します。稼働確認とデプロイ状況の通知を行い、担当リポジトリのIssueを検索か収集の表から見つけて担当を確定します。あわせて、進行中のすべての作業項目をGitHub側の状態と突き合わせ、後始末が必要なものを処理します。失敗、人の対応待ち、期限切れの作業項目は、対象のIssueやPRが閉じられていれば取り消して、要対応の一覧から外します。
args: {}
cron_version: v2
enabled: true
is_flow: false
no_flow_overlap: true
on_failure: f/factory/on_error_schedule
schedule: 0 */5 * * * *
script_path: f/factory/poll_issues
timezone: Asia/Tokyo
ws_error_handler_muted: false
