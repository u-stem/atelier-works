summary: '[SF-3-2] レビュー指摘の修正と再レビュー依頼'
description: >-
  PRへの指摘を自動で修正します。安全確認を行ったうえで新しい指摘を集め、Claudeに修正を適用させます。適用結果を検証し、問題なければ変更をpushして再レビューを依頼します。試行回数の上限を超えた場合や危険な変更を検知した場合は、対応が必要な状態(needs_human)にするか、要件定義からやり直します。
value:
  modules:
    - id: pr_fix_prepare
      summary: '[SF-3-2/1] worktree の準備と安全確認'
      value:
        type: script
        input_transforms:
          work_item_id:
            type: javascript
            expr: flow_input.work_item_id
        path: f/factory/steps/pr_fix_prepare
      timeout:
        type: static
        value: 1800
    - id: pr_fix_collect
      summary: '[SF-3-2/2] 指摘の収集'
      value:
        type: script
        input_transforms:
          owner:
            type: javascript
            expr: results.pr_fix_prepare.owner
          pr_number:
            type: javascript
            expr: results.pr_fix_prepare.pr_number
          repo:
            type: javascript
            expr: results.pr_fix_prepare.repo
          work_item_id:
            type: javascript
            expr: flow_input.work_item_id
        path: f/factory/steps/pr_fix_collect
      skip_if:
        expr: results.pr_fix_prepare.outcome !== "proceed"
      timeout:
        type: static
        value: 600
    - id: pr_fix_apply
      summary: '[SF-3-2/3] 修正の適用(Claude)'
      value:
        type: script
        input_transforms:
          attempt:
            type: javascript
            expr: results.pr_fix_prepare.attempt
          comments:
            type: javascript
            expr: results.pr_fix_collect?.comments ?? []
          factory_clone_dir:
            type: javascript
            expr: results.pr_fix_prepare.factory_clone_dir
          head_sha:
            type: javascript
            expr: results.pr_fix_prepare.head_sha
          owner:
            type: javascript
            expr: results.pr_fix_prepare.owner
          parent_work_item_id:
            type: javascript
            expr: results.pr_fix_prepare.parent_work_item_id
          pr_number:
            type: javascript
            expr: results.pr_fix_prepare.pr_number
          repo:
            type: javascript
            expr: results.pr_fix_prepare.repo
          reviews:
            type: javascript
            expr: results.pr_fix_collect?.reviews ?? []
          work_item_id:
            type: javascript
            expr: flow_input.work_item_id
          worktree_dir:
            type: javascript
            expr: results.pr_fix_prepare.worktree_dir
          worktree_git_pointer:
            type: javascript
            expr: results.pr_fix_prepare.worktree_git_pointer ?? null
        path: f/factory/steps/pr_fix_apply
      retry:
        constant:
          attempts: 2
          seconds: 60
      skip_if:
        expr: results.pr_fix_prepare.outcome !== "proceed" ||
          results.pr_fix_collect?.outcome !== "proceed"
      timeout:
        type: static
        value: 7200
    - id: pr_fix_verify
      summary: '[SF-3-2/4] 変更の検証'
      value:
        type: script
        input_transforms:
          apply_commit_body:
            type: javascript
            expr: results.pr_fix_apply.commit_body
          apply_commit_subject:
            type: javascript
            expr: results.pr_fix_apply.commit_subject
          apply_outcome:
            type: javascript
            expr: results.pr_fix_apply.outcome
          apply_reason:
            type: javascript
            expr: results.pr_fix_apply.reason
          apply_replies:
            type: javascript
            expr: results.pr_fix_apply.replies
          apply_summary:
            type: javascript
            expr: results.pr_fix_apply.summary
          attempt:
            type: javascript
            expr: results.pr_fix_prepare.attempt
          branch:
            type: javascript
            expr: results.pr_fix_prepare.branch ?? null
          comments:
            type: javascript
            expr: results.pr_fix_collect?.comments ?? []
          factory_clone_dir:
            type: javascript
            expr: results.pr_fix_prepare.factory_clone_dir
          head_sha:
            type: javascript
            expr: results.pr_fix_prepare.head_sha
          owner:
            type: javascript
            expr: results.pr_fix_prepare.owner
          parent_work_item_id:
            type: javascript
            expr: results.pr_fix_prepare.parent_work_item_id
          pr_number:
            type: javascript
            expr: results.pr_fix_prepare.pr_number
          repo:
            type: javascript
            expr: results.pr_fix_prepare.repo
          reviews:
            type: javascript
            expr: results.pr_fix_collect?.reviews ?? []
          work_item_id:
            type: javascript
            expr: flow_input.work_item_id
          worktree_dir:
            type: javascript
            expr: results.pr_fix_prepare.worktree_dir
          worktree_git_pointer:
            type: javascript
            expr: results.pr_fix_prepare.worktree_git_pointer ?? null
        path: f/factory/steps/pr_fix_verify
      skip_if:
        expr: results.pr_fix_prepare.outcome !== "proceed" ||
          results.pr_fix_collect?.outcome !== "proceed"
      timeout:
        type: static
        value: 21600
    - id: pr_fix_finish
      summary: '[SF-3-2/5] push と再レビュー依頼'
      value:
        type: script
        input_transforms:
          summary:
            type: javascript
            expr: results.pr_fix_verify?.summary ?? ""
          comments:
            type: javascript
            expr: results.pr_fix_collect?.comments ?? []
          commit_body:
            type: javascript
            expr: results.pr_fix_verify?.commit_body ?? null
          commit_subject:
            type: javascript
            expr: results.pr_fix_verify?.commit_subject ?? null
          fix_round:
            type: javascript
            expr: results.pr_fix_prepare.fix_round
          head_sha:
            type: javascript
            expr: results.pr_fix_prepare.head_sha
          max_comment_id:
            type: javascript
            expr: results.pr_fix_collect?.max_comment_id ?? 0
          max_review_comment_id:
            type: javascript
            expr: results.pr_fix_collect?.max_review_comment_id ?? 0
          max_review_id:
            type: javascript
            expr: results.pr_fix_collect?.max_review_id ?? 0
          outcome:
            type: javascript
            expr: 'results.pr_fix_verify == null ? (results.pr_fix_collect == null
              ? results.pr_fix_prepare.outcome : results.pr_fix_collect.outcome) :
              results.pr_fix_verify.outcome'
          owner:
            type: javascript
            expr: results.pr_fix_prepare.owner
          parent_work_item_id:
            type: javascript
            expr: results.pr_fix_prepare.parent_work_item_id
          pr_number:
            type: javascript
            expr: results.pr_fix_prepare.pr_number
          reason:
            type: javascript
            expr: 'results.pr_fix_verify == null ? (results.pr_fix_collect == null
              ? results.pr_fix_prepare.reason : results.pr_fix_collect.reason) : results.pr_fix_verify.reason'
          replies:
            type: javascript
            expr: results.pr_fix_verify?.replies ?? []
          repo:
            type: javascript
            expr: results.pr_fix_prepare.repo
          repo_dir:
            type: javascript
            expr: results.pr_fix_prepare.repo_dir
          reviews:
            type: javascript
            expr: results.pr_fix_collect?.reviews ?? []
          trigger_review_ids:
            type: javascript
            expr: results.pr_fix_collect?.trigger_review_ids ?? []
          work_item_id:
            type: javascript
            expr: flow_input.work_item_id
          worktree_dir:
            type: javascript
            expr: results.pr_fix_prepare.worktree_dir
          worktree_git_pointer:
            type: javascript
            expr: results.pr_fix_prepare.worktree_git_pointer ?? null
        path: f/factory/steps/pr_fix_finish
      timeout:
        type: static
        value: 5400
  failure_module:
    id: failure
    value:
      type: script
      input_transforms:
        error:
          type: javascript
          expr: error
        path:
          type: static
          value: f/factory/pr_fix
        work_item_id:
          type: javascript
          expr: flow_input.work_item_id
      path: f/factory/on_error_flow
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - work_item_id
  properties:
    work_item_id:
      type: integer
      description: >-
        修正処理の対象となる作業項目のID。GitHub Issueのコメントや、Discordの通知に記載されています。
  required:
    - work_item_id
