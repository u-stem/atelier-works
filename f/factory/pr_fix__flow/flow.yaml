summary: '[SF-3-2] レビュー指摘の修正と再レビュー依頼'
description: >-
  自動修正を PR に適用する(docs/architecture.md、docs/security.md
  「pr_fix の安全策」参照)。試行前の安全確認を行い、新規の人間の指摘を
  収集し、gtr worktree 上で headless Claude(factory-fix スキル、Bash
  なし)を実行して修正、禁止ファイルパターンと
  `factory_config.allowed_check_commands` で変更を検証したうえで push・
  コメント返信・再レビュー依頼を行う。あるいは needs_human / blocked へ
  遷移、または元 Issue への要件定義再生成サイクルへ差し戻す。
value:
  modules:
    - id: pr_fix_prepare
      summary: '[SF-3-2/1] worktree の準備と安全確認'
      value:
        type: script
        input_transforms:
          work_item_id:
            type: javascript
            expr: flow_input.work_item_id
        path: f/factory/steps/pr_fix_prepare
    - id: pr_fix_collect
      summary: '[SF-3-2/2] 指摘の収集'
      value:
        type: script
        input_transforms:
          owner:
            type: javascript
            expr: results.pr_fix_prepare.owner
          pr_number:
            type: javascript
            expr: results.pr_fix_prepare.pr_number
          repo:
            type: javascript
            expr: results.pr_fix_prepare.repo
          work_item_id:
            type: javascript
            expr: flow_input.work_item_id
        path: f/factory/steps/pr_fix_collect
      skip_if:
        expr: results.pr_fix_prepare.outcome !== "proceed"
    - id: pr_fix_apply
      summary: '[SF-3-2/3] 修正の適用(Claude)'
      value:
        type: script
        input_transforms:
          attempt:
            type: javascript
            expr: results.pr_fix_prepare.attempt
          comments:
            type: javascript
            expr: results.pr_fix_collect?.comments ?? []
          factory_clone_dir:
            type: javascript
            expr: results.pr_fix_prepare.factory_clone_dir
          fix_round:
            type: javascript
            expr: results.pr_fix_prepare.fix_round
          head_sha:
            type: javascript
            expr: results.pr_fix_prepare.head_sha
          owner:
            type: javascript
            expr: results.pr_fix_prepare.owner
          parent_work_item_id:
            type: javascript
            expr: results.pr_fix_prepare.parent_work_item_id
          pr_number:
            type: javascript
            expr: results.pr_fix_prepare.pr_number
          repo:
            type: javascript
            expr: results.pr_fix_prepare.repo
          reviews:
            type: javascript
            expr: results.pr_fix_collect?.reviews ?? []
          work_item_id:
            type: javascript
            expr: flow_input.work_item_id
          worktree_dir:
            type: javascript
            expr: results.pr_fix_prepare.worktree_dir
        path: f/factory/steps/pr_fix_apply
      retry:
        exponential:
          attempts: 2
          multiplier: 4
          random_factor: 0
          seconds: 30
      skip_if:
        expr: results.pr_fix_prepare.outcome !== "proceed" ||
          results.pr_fix_collect?.outcome !== "proceed"
    - id: pr_fix_verify
      summary: '[SF-3-2/4] 変更の検証'
      value:
        type: script
        input_transforms:
          apply_commit_message:
            type: javascript
            expr: results.pr_fix_apply.commit_message
          apply_outcome:
            type: javascript
            expr: results.pr_fix_apply.outcome
          apply_reason:
            type: javascript
            expr: results.pr_fix_apply.reason
          apply_replies:
            type: javascript
            expr: results.pr_fix_apply.replies
          apply_summary:
            type: javascript
            expr: results.pr_fix_apply.summary
          attempt:
            type: javascript
            expr: results.pr_fix_prepare.attempt
          comments:
            type: javascript
            expr: results.pr_fix_collect?.comments ?? []
          factory_clone_dir:
            type: javascript
            expr: results.pr_fix_prepare.factory_clone_dir
          fix_round:
            type: javascript
            expr: results.pr_fix_prepare.fix_round
          owner:
            type: javascript
            expr: results.pr_fix_prepare.owner
          parent_work_item_id:
            type: javascript
            expr: results.pr_fix_prepare.parent_work_item_id
          pr_number:
            type: javascript
            expr: results.pr_fix_prepare.pr_number
          repo:
            type: javascript
            expr: results.pr_fix_prepare.repo
          reviews:
            type: javascript
            expr: results.pr_fix_collect?.reviews ?? []
          work_item_id:
            type: javascript
            expr: flow_input.work_item_id
          worktree_dir:
            type: javascript
            expr: results.pr_fix_prepare.worktree_dir
        path: f/factory/steps/pr_fix_verify
      skip_if:
        expr: results.pr_fix_prepare.outcome !== "proceed" ||
          results.pr_fix_collect?.outcome !== "proceed"
    - id: pr_fix_finish
      summary: '[SF-3-2/5] push と再レビュー依頼'
      value:
        type: script
        input_transforms:
          summary:
            type: javascript
            expr: results.pr_fix_verify?.summary ?? ""
          comments:
            type: javascript
            expr: results.pr_fix_collect?.comments ?? []
          commit_message:
            type: javascript
            expr: results.pr_fix_verify?.commit_message ?? null
          fix_round:
            type: javascript
            expr: results.pr_fix_prepare.fix_round
          head_sha:
            type: javascript
            expr: results.pr_fix_prepare.head_sha
          max_comment_id:
            type: javascript
            expr: results.pr_fix_collect?.max_comment_id ?? 0
          max_review_comment_id:
            type: javascript
            expr: results.pr_fix_collect?.max_review_comment_id ?? 0
          max_review_id:
            type: javascript
            expr: results.pr_fix_collect?.max_review_id ?? 0
          outcome:
            type: javascript
            expr: 'results.pr_fix_verify == null ? (results.pr_fix_collect == null ?
              results.pr_fix_prepare.outcome : results.pr_fix_collect.outcome) :
              results.pr_fix_verify.outcome'
          owner:
            type: javascript
            expr: results.pr_fix_prepare.owner
          parent_work_item_id:
            type: javascript
            expr: results.pr_fix_prepare.parent_work_item_id
          pr_number:
            type: javascript
            expr: results.pr_fix_prepare.pr_number
          reason:
            type: javascript
            expr: 'results.pr_fix_verify == null ? (results.pr_fix_collect == null ?
              results.pr_fix_prepare.reason : results.pr_fix_collect.reason) :
              results.pr_fix_verify.reason'
          replies:
            type: javascript
            expr: results.pr_fix_verify?.replies ?? []
          repo:
            type: javascript
            expr: results.pr_fix_prepare.repo
          repo_dir:
            type: javascript
            expr: results.pr_fix_prepare.repo_dir
          reviews:
            type: javascript
            expr: results.pr_fix_collect?.reviews ?? []
          trigger_review_ids:
            type: javascript
            expr: results.pr_fix_collect?.trigger_review_ids ?? []
          work_item_id:
            type: javascript
            expr: flow_input.work_item_id
          worktree_dir:
            type: javascript
            expr: results.pr_fix_prepare.worktree_dir
        path: f/factory/steps/pr_fix_finish
  failure_module:
    id: failure
    value:
      type: script
      input_transforms:
        error:
          type: javascript
          expr: error
        path:
          type: static
          value: f/factory/pr_fix
        work_item_id:
          type: javascript
          expr: flow_input.work_item_id
      path: f/factory/on_error_flow
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - work_item_id
  properties:
    work_item_id:
      type: integer
      description: factory.work_items.id of the pr_fix-kind work item to process.
  required:
    - work_item_id
