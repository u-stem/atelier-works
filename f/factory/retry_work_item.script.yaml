summary: '[OP-2-2] 作業項目を再実行'
description: 詰まってしまった作業項目を手動で再実行します。作業項目の種類と承認状況に応じて対象の処理(要件定義・実装・PRレビュー・PR修正)と目指す状態を切り替えます。
lock: '!inline f/factory/retry_work_item.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    work_item_id:
      type: number
      description: 再実行する作業項目のID。GitHub Issueのコメントや、Discordの通知に記載されています。
      default: null
  required:
    - work_item_id
