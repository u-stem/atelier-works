summary: '[OP-1-5] 調査(実装せずに調べて、結果をIssueのコメントで返す)'
description: >-
  依頼文に沿って、リポジトリを実装せずに調べ、結果を依頼したIssueのコメントで返します。手動で実行します。対象のIssueは、開いていて、作者が運用者のPATのアカウントであるものに限ります。登録のstepが、調査の設定、稼働中の調査、隔離の測定のジョブを確かめ、断るときは行を作りません。生成のstepは、隔離の測定に合格しているときだけ、読み出し専用のClaudeを起動します。結果は、無害化と秘密値の検査を通ったときだけ投稿されます。失敗はIssueには書かず、DiscordとConsoleで知らせます。
value:
  modules:
    - id: investigate_register
      summary: '[OP-1-5/1] 対象と依頼文を確かめて調査を登録'
      value:
        type: script
        input_transforms:
          issue_number:
            type: javascript
            expr: flow_input.issue_number
          owner:
            type: javascript
            expr: flow_input.owner
          repo:
            type: javascript
            expr: flow_input.repo
          request:
            type: javascript
            expr: flow_input.request
        path: f/factory/steps/investigate_register
      timeout:
        type: static
        value: 600
    - id: investigate_prepare
      summary: '[OP-1-5/2] 設定、予算、時間を確かめ、調べるコミットを決める'
      value:
        type: script
        input_transforms:
          work_item_id:
            type: javascript
            expr: results.investigate_register.work_item_id
        path: f/factory/steps/investigate_prepare
      skip_if:
        expr: results.investigate_register.skip === true
      timeout:
        type: static
        value: 1800
    - id: investigate_generate
      summary: '[OP-1-5/3] 隔離を確かめ、読み出し専用のClaudeで調査して本文を作る'
      value:
        type: script
        input_transforms:
          factory_clone_dir:
            type: javascript
            expr: results.investigate_prepare.factory_clone_dir
          repo_dir:
            type: javascript
            expr: results.investigate_prepare.repo_dir
          sha:
            type: javascript
            expr: results.investigate_prepare.sha
          work_item_id:
            type: javascript
            expr: results.investigate_register.work_item_id
        path: f/factory/steps/investigate_generate
      skip_if:
        expr: >-
          results.investigate_register.skip === true ||
          results.investigate_prepare?.skip === true
      timeout:
        type: static
        value: 7200
    - id: investigate_post
      summary: '[OP-1-5/4] 最終の本文に秘密値の検査をもう一度掛けて、Issueへ投稿'
      value:
        type: script
        input_transforms:
          comment_body:
            type: javascript
            expr: results.investigate_generate?.comment_body ?? null
          withheld:
            type: javascript
            expr: results.investigate_generate?.withheld ?? null
          work_item_id:
            type: javascript
            expr: results.investigate_register.work_item_id
        path: f/factory/steps/investigate_post
      skip_if:
        expr: >-
          results.investigate_register.skip === true ||
          results.investigate_prepare?.skip === true ||
          results.investigate_generate?.skip === true
      timeout:
        type: static
        value: 1800
  failure_module:
    id: failure
    value:
      type: script
      input_transforms:
        error:
          type: javascript
          expr: JSON.stringify(error ?? null).replace(/\$/g, "\\u0024")
        path:
          type: static
          value: f/factory/investigate
      path: f/factory/on_error_flow
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - owner
    - repo
    - issue_number
    - request
  properties:
    issue_number:
      type: integer
      description: 結果を返すIssueの番号。開いていて、作者が運用者のPATのアカウントであるものに限ります。
    owner:
      type: string
      description: 対象リポジトリを所有するGitHubのユーザー名または組織名。
    repo:
      type: string
      description: 対象リポジトリ名。
    request:
      type: string
      description: 調べてほしいこと。Issueの本文は読みません。この文だけが依頼として使われます。
  required:
    - owner
    - repo
    - issue_number
    - request
