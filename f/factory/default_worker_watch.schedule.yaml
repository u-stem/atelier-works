summary: '[SYS-10] defaultのworkerの停止を検知'
description: >-
  5分ごとに実行します。defaultのqueueに予定時刻から10分以上待つジョブがあり、defaultで動いているジョブが1つも無いときだけ、defaultのworkerが止まっているとして通知を残し、Discordにも知らせます。長いClaudeのジョブが枠を塞いでいるだけのときは知らせません。待ちが解けると通知を自動で解決します。
args: {}
cron_version: v2
enabled: true
is_flow: false
no_flow_overlap: true
schedule: 45 4-59/5 * * * *
script_path: f/factory/default_worker_watch
timezone: Asia/Tokyo
ws_error_handler_muted: false
