summary: '[OP-2-1] 承認 / 差し戻しを記録して反映'
description: 承認待ちの承認依頼(要件定義またはIssue化提案)に対して、承認または差し戻しの判断を記録するためのフォームです。判断を記録すると、対応する反映処理が起動します。
lock: '!inline f/factory/approval_decide.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    approval_request_id:
      type: number
      description: 承認または差し戻しの対象となる承認依頼のID。Consoleの要対応に記載されています。
      default: null
    decision:
      type: string
      description: approve = 承認して次工程へ、reject = 差し戻す
      default: null
      originalType: string
    note:
      type: string
      description: 任意の補足メモ。理由に併記して記録されます。
      default: null
      originalType: string
    options:
      type: object
      description: '決定に付随する追加オプション(例: Issue化提案のwith_factory_label)。省略時は空オブジェクトです。'
      default: {}
      format: resource-record
    reason:
      type: string
      description: 差し戻す理由。承認する場合は空でも構いません。
      default: null
      originalType: string
  required:
    - approval_request_id
    - decision
    - reason
    - note
tag: console
timeout: 120
