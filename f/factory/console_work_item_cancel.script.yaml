summary: '[OP-2-15] 作業項目を中止'
description: Factory
  Consoleから、実行中のジョブが無い作業項目を1件中止します。対象は、種別と状態が許可表にある作業項目だけです。承認待ち、承認済み(実装の起動の前)、止まった状態が当たります。作業項目を取り消しにし、要件定義と設計の保留中の承認依頼を期限切れにします。Issue化の提案の依頼は残ります。読んだ後に状態が変わっていれば中止しません。操作の前に記録を残し、残せなければ中止しません。中止した作業項目は再開できません。
lock: '!inline f/factory/console_work_item_cancel.script.lock'
kind: script
schema:
  properties:
    work_item_id:
      type: number
      description: ''
      default: null
      originalType: number
  required:
    - work_item_id
tag: console
timeout: 30
