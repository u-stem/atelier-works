summary: '[OP-2-9] 保留と凍結を置く'
description: Factory
  Consoleから、マージの保留、deployの保留、scheduleの凍結を1件置きます。置く主体は人に固定し、操作者は実行したユーザーから決まります。期限は分で受け、マージの保留とscheduleの凍結は24時間、deployの保留は120分を超えられません。理由は必須です。別の主体が置いた有効な同種の行があるときは置きません。操作の前に記録を残し、残せなければ置きません。置いた後に読み直して返します。
