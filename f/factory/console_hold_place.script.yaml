summary: '[OP-2-9] 保留と凍結を置く'
description: Factory
  Consoleから、マージの保留、deployの保留、スケジュールの凍結を1件置きます。置く主体は人に固定し、操作者は実行したユーザーから決まります。期限は分で受け、マージの保留とスケジュールの凍結は24時間、deployの保留は120分を超えられません。理由は必須です。ローカルのセッションが置いた有効な同種の保留か凍結があるとき、変数の行数が上限に達しているときは置きません。操作の前に記録を残し、残せなければ置きません。置いた後に読み直し、置いた行と他の行が残っているかを確かめて返します。
lock: '!inline f/factory/console_hold_place.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    kind:
      type: string
      description: ''
      default: null
      originalType: string
    minutes:
      type: number
      description: ''
      default: null
    reason:
      type: string
      description: ''
      default: null
      originalType: string
    target:
      type: string
      description: ''
      default: null
      originalType: string
  required:
    - kind
    - target
    - minutes
    - reason
tag: console
timeout: 30
