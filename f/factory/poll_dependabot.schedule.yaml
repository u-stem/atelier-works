summary: '[SF-1-3] dependabotのPRを巡回して自動マージを起動'
description: >-
  10分ごとに実行します。設定のdependabot_enabledが無効なら何もしません。有効なら、dependabotが開いた、mainをbaseにする、draftでないPRを探し、自動でマージする条件をフローと同じ検査で確かめます。条件を満たしたPRだけ、依存の更新PRの検査と自動マージのフローを起動します。待つ間は何も作らず、待ちが長引いたPRや条件を満たさないPRは、人の対応待ちにして1回だけ通知します。同じPRにレビューか修正の処理が動いている間と、同じheadを処理した後は、選びません。
args: {}
cron_version: v2
enabled: true
is_flow: false
no_flow_overlap: true
on_failure: f/factory/on_error_schedule
schedule: 0 */10 * * * *
script_path: f/factory/poll_dependabot
timezone: Asia/Tokyo
ws_error_handler_muted: false
