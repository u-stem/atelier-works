summary: '[SF-3-2/4] 変更の検証'
description: 適用された修正を検証するステップです。禁止された変更が含まれていないか確認したうえで、リポジトリのチェックコマンドを実行します。チェックに失敗した場合は、Claudeによる修正と再検証を1回だけ行います。
lock: '!inline f/factory/steps/pr_fix_verify.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    apply_outcome:
      type: object
      description: 修正適用の結果。
      default: null
      format: resource-fix_outcome
    attempt:
      type: number
      description: この処理の実行回数。
      default: null
    auto_tree_sha:
      type: string
      description: ''
      default: null
      originalType: string
    base_sha:
      type: string
      description: ''
      default: null
      originalType: string
    baseline_sha:
      type: string
      description: ''
      default: null
      originalType: string
    branch:
      type: string
      description: ''
      default: null
      originalType: string
    ci_check_id:
      type: number
      description: ''
      default: null
    conflict_check_id:
      type: number
      description: ''
      default: null
    factory_clone_dir:
      type: string
      description: Software Factory自身の複製を置いた作業ディレクトリのパス。
      default: null
      originalType: string
    head_sha:
      type: string
      description: ''
      default: null
      originalType: string
    owner:
      type: string
      description: 対象リポジトリを所有するGitHubのユーザー名または組織名。
      default: null
      originalType: string
    parent_work_item_id:
      type: number
      description: 元になった作業項目(Issueの処理)のID。
      default: null
    pr_number:
      type: number
      description: 対象PRの番号。
      default: null
    repo:
      type: string
      description: 対象リポジトリ名。
      default: null
      originalType: string
    untrusted:
      type: string
      description: 修正の結果、指摘とコメントの本文、競合したファイルのパスと中身を、JSONの文字列に包んだもの。
      default: null
      originalType: string
    work_item_id:
      type: number
      description: 対象の作業項目のID。
      default: null
    worktree_dir:
      type: string
      description: この処理で使う作業用ディレクトリのパス。
      default: null
      originalType: string
    worktree_git_pointer:
      type: string
      description: ''
      default: null
      originalType: string
  required:
    - work_item_id
    - owner
    - repo
    - pr_number
    - apply_outcome
    - untrusted
    - worktree_dir
    - factory_clone_dir
    - attempt
