summary: '[SF-2-1/3] 承認依頼'
description: 生成した要件定義の承認を依頼するステップです。承認依頼(approval_requests)を記録して作業項目を承認待ちの状態にし、IssueへのコメントとDiscord通知で承認を依頼したうえで、待機せずに終了します(承認 / 却下は`approval_decide`が別途処理します)。
lock: '!inline f/factory/steps/pipeline_request_approval.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    attempt:
      type: number
      description: 要件定義生成の試行回数。
      default: null
    work_item_id:
      type: number
      description: 対象の作業項目のID。
      default: null
  required:
    - work_item_id
    - attempt
