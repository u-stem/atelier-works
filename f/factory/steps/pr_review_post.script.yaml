summary: '[SF-3-1/3] レビューの投稿'
description: 生成したレビューをPRにコメントとして投稿するステップです。投稿後は作業項目の状態を更新し、付与されたラベルを外してDiscordに通知します。
lock: '!inline f/factory/steps/pr_review_post.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    binary_unlisted_count:
      type: number
      description: パスを変更ファイルと照合できず、一覧に載せなかったバイナリのファイルの件数。
      default: null
    owner:
      type: string
      description: 対象リポジトリを所有するGitHubのユーザー名または組織名。
      default: null
      originalType: string
    pr_number:
      type: number
      description: 対象PRの番号。
      default: null
    repo:
      type: string
      description: 対象リポジトリ名。
      default: null
      originalType: string
    repo_dir:
      type: string
      description: 対象リポジトリを展開した作業ディレクトリのパス。
      default: null
      originalType: string
    review_sha:
      type: string
      description: レビュー対象とするPRの最新コミットのSHA。
      default: null
      originalType: string
    skip:
      type: boolean
      description: このステップの処理を省略するかどうか。
      default: null
    untrusted:
      type: string
      description: レビューの総評、判定、指摘、スレッドへの答え、変更ファイルとバイナリのパス、変更の範囲を、JSONの文字列に包んだもの。
      default: null
      originalType: string
    work_item_id:
      type: number
      description: 対象の作業項目のID。
      default: null
    worktree_dir:
      type: string
      description: この処理で使う作業用ディレクトリのパス。
      default: null
      originalType: string
  required:
    - work_item_id
    - skip
    - owner
    - repo
    - pr_number
    - review_sha
    - untrusted
    - binary_unlisted_count
    - worktree_dir
    - repo_dir
