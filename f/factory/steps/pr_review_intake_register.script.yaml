summary: '[OP-1-3/1] PRを確かめてレビューを登録'
description: Consoleから投入されたPRを確かめ、pr_reviewの作業項目を登録してレビューのフローを起動します。許可されていないリポジトリ、存在しないPR、閉じたPR、headが別のリポジトリにあるPR、オーナーのIDが食い違うリポジトリ、リポジトリの名前が変わったPR、同じPRで稼働中のレビューがある場合は、登録せずに理由を返します。
lock: '!inline f/factory/steps/pr_review_intake_register.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    owner:
      type: string
      description: 対象リポジトリを所有するGitHubのユーザー名または組織名。
      default: null
      originalType: string
    pr_number:
      type: number
      description: レビューするPRの番号。正の整数です。
      default: null
    repo:
      type: string
      description: 対象リポジトリ名。
      default: null
      originalType: string
  required:
    - owner
    - repo
    - pr_number
