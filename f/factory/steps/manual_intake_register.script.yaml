summary: '[OP-1-1/2] 作業項目を登録して工程 2 を起動'
description: 作成されたIssueの担当を確定し、作業項目として登録します。GitHubへ確認コメントを投稿してDiscordに通知したうえで、要件定義の生成を開始します。
lock: '!inline f/factory/steps/manual_intake_register.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    body:
      type: string
      description: 作成されたIssueの本文。
      default: null
      originalType: string
    issue_number:
      type: number
      description: 作成されたIssueの番号。
      default: null
    issue_url:
      type: string
      description: 作成されたIssueのURL。
      default: null
      originalType: string
    owner:
      type: string
      description: 対象リポジトリを所有するGitHubのユーザー名または組織名。
      default: null
      originalType: string
    repo:
      type: string
      description: 対象リポジトリ名。
      default: null
      originalType: string
    title:
      type: string
      description: 作成されたIssueのタイトル。
      default: null
      originalType: string
  required:
    - owner
    - repo
    - issue_number
    - issue_url
    - title
    - body
