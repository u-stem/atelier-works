summary: '[OP-0-1/1] Console用データ取得'
description: Factory Console(承認・進捗・分析ダッシュボード)が表示する一覧・集計データを、対応するData
  Tableのビューから読み取り専用で取得します。承認や再実行などの操作は行いません。
lock: '!inline f/factory/steps/console_query.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    approval_request_id:
      type: number
      description: view が approval_design_doc のとき必須。設計の承認依頼の id。
      default: null
    attempt:
      type: number
      description: view が requirements_doc のとき、取得する試行番号(省略時は最新)。
      default: null
    days:
      type: number
      description: 何日前までのデータを対象にするか(既定30日)。
      default: null
    limit:
      type: number
      description: 取得する最大件数(既定200件)。
      default: null
    view:
      type: string
      description: 取得するデータの種類。inbox(承認待ち) / pipeline(作業項目一覧) / agent_cost_daily(日別コスト)
        / approval_stats(承認統計) / lead_time(リードタイム) / failures(失敗一覧) /
        notices(未解決の通知。重要度と解決可否つき) / reviews(PRレビュー) / fix_rounds(PR修正) /
        requirements_index(要件定義の一覧) / requirements_doc(要件定義書1件の全文) /
        approval_design_doc(設計の承認依頼が指す設計書。承認後の実装が受け取る文字そのもの) /
        audit_index(監査の一覧) / audit_doc(監査1件の全文) / deployments(反映の履歴と含まれるPR) /
        summary(要対応の件数と一覧。1つのオブジェクトを返す) /
        work_item_detail(作業項目1件の概要と履歴。1つのオブジェクトを返す) /
        system_status(反映と取り込みの状態、作業項目の無い失敗、情報の通知、解決済みの通知。1つのオブジェクトを返す) /
        intake_targets(手動投入で選べるリポジトリ。owner と repo の配列)のいずれか。
      default: null
      originalType: string
    work_item_id:
      type: number
      description: view が requirements_doc / audit_doc / work_item_detail のとき必須。対象の
        work_item_id。
      default: null
  required:
    - view
tag: console
timeout: 60
