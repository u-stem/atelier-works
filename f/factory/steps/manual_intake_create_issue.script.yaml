summary: '[OP-1-1/1] Issueを作成'
description: 投入されたタイトル・目的・受入基準をもとにGitHub Issueを作成します。作成したIssueの情報を次のステップに渡します。
lock: '!inline f/factory/steps/manual_intake_create_issue.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    acceptance_criteria:
      type: string
      description: 受入基準。1行につき1項目で入力してください(任意)。
      default: null
      originalType: string
    body:
      type: string
      description: このタスクで達成したい目的。
      default: null
      originalType: string
    owner:
      type: string
      description: 対象リポジトリを所有するGitHubのユーザー名または組織名。
      default: null
      originalType: string
    profile:
      type: string
      description: 作業の進め方。受け付けない値は、Issueを作らずに断ります。
      default: standard
      originalType: string
    repo:
      type: string
      description: 対象リポジトリ名。
      default: null
      originalType: string
    title:
      type: string
      description: 作成するIssueのタイトル。
      default: null
      originalType: string
  required:
    - owner
    - repo
    - title
    - body
    - acceptance_criteria
