summary: '[OP-2-4] 承認の前にIssueが取り込み時点と同じか確かめる'
description: 要件定義の承認の前に、GitHub上の現在のIssueの題名と本文が、取り込み時点のものと同じかを確かめます。承認の記録から同期で呼ばれ、判定(match
  / changed / not_applicable / unavailable)だけを返します。
lock: '!inline f/factory/steps/approval_check_issue.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    approval_request_id:
      type: number
      description: 確かめる承認依頼のID。
      default: null
  required:
    - approval_request_id
timeout: 30
