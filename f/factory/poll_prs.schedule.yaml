summary: Poll pull requests for review/fix triggers and start pr_review.flow / pr_fix.flow.
description: >-
  Every 5 minutes: review_label / review-requested / assignee detection for
  pr_review.flow, and fix_label / "/factory fix" comment detection for
  pr_fix.flow — spec-cycle2.md §3 M5, §7 item 1.
schedule: 0 */5 * * * *
timezone: Asia/Tokyo
enabled: true
script_path: f/factory/poll_prs
is_flow: false
args: {}
on_failure: f/factory/on_error_schedule
no_flow_overlap: true
