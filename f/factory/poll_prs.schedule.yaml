summary: '[SF-1-2] PR を巡回してレビュー / 修正を起動'
description: >-
  5分毎に実行。review_label / review-requested / assignee による
  `pr_review__flow` 起動判定と、fix_label / `/factory fix` コメントによる
  `pr_fix__flow` 起動判定を行う(docs/architecture.md 参照)。
args: {}
cron_version: v2
enabled: true
is_flow: false
no_flow_overlap: true
on_failure: f/factory/on_error_schedule
schedule: 0 */5 * * * *
script_path: f/factory/poll_prs
timezone: Asia/Tokyo
ws_error_handler_muted: false
