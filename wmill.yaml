# yaml-language-server: $schema=wmill.schema.json
# wmill.yaml: Windmill CLIの設定
# 全項目の説明は`wmill config`で見られる。

# 新しいscriptの既定のTypeScriptランタイム
defaultTs: bun                  # bun or deno

# syncに含めるファイルのglobパターン
includes: 
  - "f/**"           # use ** for all, f/** for folder-scoped

# `includes`に足すglobパターン(ワークスペースごとの上書きで使う)
# extraIncludes: []

# syncから除くファイルのglobパターン
excludes:
  # インスタンス固有(`owners`・`instance_name`・`windmill_public_url`は
  # 環境ごとに違う)なので、gitからsyncせずWindmill UIで編集する。初回の
  # bootstrapで使う初期値は`templates/factory_config.resource.yaml`、作り方は
  # `scripts/bootstrap.sh`を参照。
  - "f/factory/factory_config.resource.yaml"
  # インスタンス固有の設定ではなく、インスタンス固有の変わる状態。
  # `self_update`が、デプロイしたshaを実行時にこの秘密でない変数へ書く。
  # 普通の変数のようにsyncすると、無関係な`wmill sync push`のたびに
  # コミット済みの空の値へ戻る。すると`self_update`が「変化無し」を「更新」と
  # 取り違え、人がホストから`mise run deploy`で同じscriptやフローの定義を
  # 上書きしている最中に、worker側からpushし直す。理論上ではなく実際に起きる競合。
  # `scripts/bootstrap.sh`が初回の設定で一度だけ変数を作る(空の値。説明は
  # そちらにある)。このファイルは、上の`factory_config.resource.yaml`と同じく、
  # 初期値の説明の出どころとしてだけリポジトリに残す。
  - "f/factory/deployed_sha.variable.yaml"
  # スケジュールの凍結の状態。`mise run freeze:place`などと`self_update`が実行時に
  # この秘密でない変数へ書く。syncすると、無関係なpushで凍結が消える。
  # `scripts/freeze.ts`と`self_update`は、このファイルの`excludes`に上の3つが
  # あることを確かめてから、凍結中のスケジュールを足した和を`--excludes`で渡す。
  # 3つが欠けると、反映しない。
  - "f/factory/freezes.variable.yaml"

# --- syncする対象 -----------------------------------------------------
# "skip"の項目の既定はfalse(syncする)、"include"の項目の既定はfalse(syncしない)

# 変数をsyncしない
skipVariables: false

# リソースをsyncしない
skipResources: false

# リソース型をsyncしない
skipResourceTypes: false

# 秘密をsyncしない(安全のため既定はtrue)
skipSecrets: true               # true by default — secrets are not synced for security

# scriptをsyncしない
skipScripts: false

# フローをsyncしない
skipFlows: false

# アプリをsyncしない
skipApps: false

# フォルダをsyncしない
skipFolders: false

# ワークスペースの依存をsyncしない
skipWorkspaceDependencies: false

# Data TableのSQLのmigrationをsyncしない
skipDatatableMigrations: false

# 以下はコメントを外すとsyncに含める(既定では除く):
# スケジュールをsyncに含める
includeSchedules: true

# トリガー(http・websocket・kafkaなど)をsyncに含める
# includeTriggers: true

# ワークスペースのユーザーをsyncに含める
# includeUsers: true

# ワークスペースのグループをsyncに含める
# includeGroups: true

# ワークスペースの設定をsyncに含める
# includeSettings: true

# 暗号鍵をsyncに含める
# includeKey: true

# --- syncの動作 ----------------------------------------------------

# sync中に並列に行う操作の数
# parallel: 4

# すべてのscriptにロックファイルを要求する
# locksRequired: true

# scriptごとに同じ内容の`.script.lock`を置かず、ワークスペースの依存ファイルごとに
# 1つのロックファイル(`locks/<depfile>.lock`)を共有する
# dedupeLockfiles: true

# push前にlintを実行する
# lint: true

# 秘密を平文で扱う(推奨しない)
# plainSecrets: false

# sync操作の既定のコミットメッセージ
# message: "my commit message"

# sync中にpromotionの上書きを取り出すブランチ名
# promotion: staging

# 今のgitのブランチが設定済みのブランチと一致するかの検証を飛ばす
# skipBranchValidation: false

# `.flow`・`.app`・`.raw_app`の代わりに`__flow`・`__app`・`__raw_app`の接尾辞を使う
nonDottedPaths: true            # recommended for new projects

# syncの動作の版。push・pullでの所有者の扱いを決める
# (v1: 更新時に`permissioned_as`を保ち、pull時に`on_behalf_of_email`を除く)
syncBehavior: v1                # v1 enables ownership preservation

# --- コードベースのバンドル(共有ライブラリ) -----------------------------
# scriptがimportするTypeScript・JavaScriptのコードベースをバンドルする。
# 各項目をバンドルしてアップロードし、scriptが共有コードをimportできるようにする。

# 共有ライブラリのバンドルの設定
codebases: []
# codebases:
#   - relative_path: ./shared          # コードベースのパス
#     includes: ["**/*.ts"]            # バンドルに含めるファイル
#     excludes: ["node_modules/**"]    # 除くファイル
#     format: esm                      # バンドルの形式: "cjs"か"esm"
#     external: ["pg", "axios"]        # バンドルしない依存
#     assets:                          # バンドルにコピーする静的ファイル
#       - from: ./static
#         to: ./dist
#     # customBundler: ./build.ts      # 独自のバンドラーのscript(esbuildの代わり)
#     # inject: ["./polyfills.ts"]     # すべてのエントリポイントに注入するファイル
#     # define:                        # コンパイル時の定数
#     #   API_URL: '"https://api.example.com"'
#     # banner:                        # 出力ファイルの先頭に足す文字列
#     #   js: "/* bundled by windmill */"
#     # loader:                        # esbuildのローダーの上書き
#     #   ".png": "dataurl"

# --- ワークスペースの対応づけ -----------------------------------------------
# ワークスペース名をWindmillのインスタンスに対応づけ、ワークスペースごとに設定を上書きする。
# キーは人が読みやすいワークスペース名。`gitBranch`と`workspaceId`の既定はキーの名前。

# ワークスペース名とWindmillのインスタンス、ワークスペースごとのsyncの上書きの対応
workspaces:
  factory:
    baseUrl: http://127.0.0.1:8080
    workspaceId: factory
  # feat/factory-foundation:
    # baseUrl: https://app.windmill.dev    # WindmillのインスタンスのURL
    # workspaceId: my-workspace            # 既定はワークスペース名
    # gitBranch: main                        # gitのブランチ(既定はワークスペース名)
    # promotionOverrides:                    # --promotionのときに適用する上書き
    #   skipSecrets: false
    # specificItems:                         # ディスクにワークスペースごとに置く項目
    #                                        # 例: file.staging.variable.yaml(接尾辞はワークスペース名)
    #   variables: ["f/my_folder/my_var"]
    #   resources: ["f/my_folder/my_res"]
    #   triggers: ["f/my_folder/my_trigger"]
    #   folders: ["my_folder"]
    #   settings: true

  # 例: 別のインスタンスにあるstagingのワークスペース
  # staging:
  #   baseUrl: https://staging.windmill.dev
  #   workspaceId: staging-workspace          # 省略すると'staging'
  #   overrides:
  #     skipSecrets: false
  #     includeSchedules: true

  # すべてのワークスペースで共有する項目
  # commonSpecificItems:
  #   variables: ["f/shared/api_key"]
  #   resources: ["f/shared/db_conn"]
  #   folders: ["shared"]
