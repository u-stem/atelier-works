# 以下の秘密・インスタンス固有・版の変数は、意図して`${VAR:?...}`の形にしている。
# `infra/.env`は無く、値は`mise.toml`の`[env]`(秘密でないものをコミット)と
# `mise.local.toml`(gitignore済みの秘密)から来る。値がこのファイルに届くのは、
# miseのタスクか子プロセス(`mise run ...`や`mise exec -- docker compose ...`)
# としてdocker composeを起動したときだけ。miseを通さずに起動すると、空の値で
# 黙って動かず、`:?`の後のメッセージですぐに失敗する。
# 例外として、`CONSOLE_GITHUB_TOKEN`だけは`${CONSOLE_GITHUB_TOKEN:-}`(未設定なら空)にしている。
# 人がトークンを投入する前でも、composeの解釈(CIのtest-dbジョブや`mise run up`)を止めないため。
# 値が空なら、`console_fetcher`が`status.json`とログに`config_missing`を出して待つ。
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "${LOG_MAX_SIZE:-20m}"
    max-file: "${LOG_MAX_FILE:-10}"
    compress: "true"

services:
  ## Postgres 16からの更新: `db_data`には18が読めないクラスタがあるので、
  ## コンテナは空で起動せず、理由を示すエラーで終了する。移行では、windmillの
  ## データベースだけでなく、クラスタ全体を(`pg_dumpall`で)ダンプする。
  ## Windmillはdatatable・DuckLake・`wm_fork_*`のデータベースを隣に置き、
  ## RLSのポリシーをクラスタ単位のロールに付与しているので、1つのデータベースだけの
  ## ダンプでは両方が黙って失われる。
  ## https://www.windmill.dev/docs/advanced/self_host#upgrade-postgresql-to-18 を参照。
  db:
    image: postgres:18
    shm_size: 1g
    restart: unless-stopped
    deploy:
      replicas: 1
    volumes:
      # 18以降の公式イメージは、クラスタをメジャー版のサブディレクトリ
      # (`/var/lib/postgresql/18/docker`)に置くので、親のディレクトリをマウントする。
      - db_data:/var/lib/postgresql
    expose:
      - 5432
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?run via mise}
      POSTGRES_DB: windmill
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  windmill_server:
    image: ghcr.io/windmill-labs/windmill:${WM_VERSION:?run via mise}
    pull_policy: always
    deploy:
      replicas: 1
    restart: unless-stopped
    expose:
      - 8000
      - 2525
    environment:
      - DATABASE_URL=postgres://postgres:${DB_PASSWORD:?run via mise}@db/windmill?sslmode=disable
      - MODE=server
      # ログインのセッションの有効期間(秒)。値はmiseの`WM_SESSION_VALIDITY_SECONDS`で決める。
      # workerには渡さず、windmill_serverだけに指定する。
      - MAX_SESSION_VALIDITY_SECONDS=${WM_SESSION_VALIDITY_SECONDS:?run via mise}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - worker_logs:/tmp/windmill/logs
    logging: *default-logging

  windmill_worker:
    # 独自のイメージ。上流のベースにclaude・gh・gtr・wmillを足し、Factoryの
    # ジョブがworktreeを使うエージェントの作業を進められるようにする。
    # `./worker/Dockerfile`を参照。
    build:
      context: ./worker
      # `mise run up`と`mise run deploy`は、このラベルが付いた宙に浮いた旧イメージだけを消す。
      # 自前でビルドするサービスには、同じラベルを付ける。
      labels:
        com.atelier-works.prune: "true"
      args:
        WM_VERSION: ${WM_VERSION:?run via mise}
        CLAUDE_VERSION: ${CLAUDE_VERSION:?run via mise}
        GH_VERSION: ${GH_VERSION:?run via mise}
        GITLEAKS_VERSION: ${GITLEAKS_VERSION:?run via mise}
        GTR_REF: ${GTR_REF:?run via mise}
        GTR_COMMIT: ${GTR_COMMIT:?run via mise}
        WMILL_VERSION: ${WMILL_VERSION:?run via mise}
        FACTORY_CHECK_UID: ${FACTORY_CHECK_UID:?run via mise}
        FACTORY_CHECK_POOL_SIZE: ${FACTORY_CHECK_POOL_SIZE:?run via mise}
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 4096M
          # 最上位の`pids_limit`ではなく`deploy.resources.limits`の下に置く。
          # このcomposeの版は、`deploy.resources.limits`と最上位の`pids_limit`を
          # 混ぜたサービスを、片方しか設定していなくても拒否するため
          # ("can't set distinct values on 'pids_limit' and
          # 'deploy.resources.limits.pids'")。
          # 検査コマンドは枠ごとに`CHECK_NPROC_LIMIT`(256)までプロセスを持てる。
          # nativeでないworkerはジョブを1つずつ動かすので、検査は1つだけが上限まで使う。
          # そのときも、検査の外に256が残る値にする。
          # `tests/infra/docker_compose.test.ts`がこの関係を確かめる。
          pids: 1024
    # 孤立した子プロセスを回収するため、docker-init(tini)をPID 1で動かす。
    # ジョブはgit・gh・esbuildの子プロセスを起動し、それらは親より長く残る
    # (裏での保守、タイムアウト時のプロセスグループごとのkill)。initが無いと
    # 子は`wait()`しないwindmillのバイナリに引き取られ、ゾンビが上のpidsの上限
    # まで溜まって、すべてのジョブが`EAGAIN`で失敗する
    # (2026-09-28に、ゾンビ430個、pids 479/512を観測)。
    init: true
    restart: unless-stopped
    # 意図してprivilegedにせず、`FAVOR_UNSHARE_PID`も使わない。上流のPID名前空間の
    # 分離はprivilegedモードでの`--mount-proc`を要し、このworkerのジョブに
    # 必要な範囲より影響が大きいため。`docs/security.md`を参照。
    security_opt:
      - "no-new-privileges:true"
    # 既定のケーパビリティのうち、workerのジョブが使わないものを落とす。
    # 検査コマンドの実行は`CHOWN`・`DAC_OVERRIDE`・`FOWNER`(worktreeの所有権の受け渡し)、
    # `SETUID`・`SETGID`・`SETPCAP`(`setpriv`)、`KILL`(別のuidのプロセスを止める)を要する。
    # `NET_RAW`は他のコンテナへのなりすましの足場になり、`MKNOD`・`SETFCAP`・`AUDIT_WRITE`は
    # gitもbunもghもclaudeも使わない。`SYS_CHROOT`・`FSETID`・`NET_BIND_SERVICE`は、
    # Windmill本体が使わないことをここでは確かめていないので、残す。
    cap_drop:
      - NET_RAW
      - MKNOD
      - SETFCAP
      - AUDIT_WRITE
    environment:
      - DATABASE_URL=postgres://postgres:${DB_PASSWORD:?run via mise}@db/windmill?sslmode=disable
      - MODE=worker
      - WORKER_GROUP=default
      # nativeでないworkerは、Windmillの制限で`NUM_WORKERS`が2以上でも1つで動く。
      # 効かない設定を残さないため、`NUM_WORKERS`は置かない。
      # defaultのworkerが同時に動かすジョブは1つで、
      # Claudeのジョブが動く間、定期のジョブは待つ。
      # workerは子プロセスの環境を絞る。イメージの`ENV CLAUDE_VERSION`を、
      # `agent_runs.claude_version`を記録するジョブまで届かせる。
      - WHITELIST_ENVS=CLAUDE_VERSION
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - worker_dependency_cache:/tmp/windmill/cache
      - worker_logs:/tmp/windmill/logs
      - factory_workspaces:/workspaces
      - factory_state:/var/lib/factory
    logging: *default-logging

  ## "native"のジョブ専用のworker。nativeのジョブはプロセス内で動き、
  ## 他のジョブよりずっと軽い。
  windmill_worker_native:
    image: ghcr.io/windmill-labs/windmill:${WM_VERSION:?run via mise}
    pull_policy: always
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 2048M
          pids: 512
    # ゾンビを回収する理由は、上の`windmill_worker`と同じ。
    init: true
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    environment:
      - DATABASE_URL=postgres://postgres:${DB_PASSWORD:?run via mise}@db/windmill?sslmode=disable
      - MODE=worker
      - WORKER_GROUP=native
      - NATIVE_MODE=true
      - SLEEP_QUEUE=200
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - worker_logs:/tmp/windmill/logs
    logging: *default-logging

  ## `factory_state`にConsole用workerがマウントするサブパスのディレクトリを作って終わる、
  ## 1回限りのサービス。サブパスのディレクトリが無いと、Console用workerは起動しない。
  ## defaultのworkerは、ジョブが初めて動くまでこのディレクトリを作らないので、
  ## 起動の前に作れるのはこのサービスだけである。
  ## defaultのworkerはrootで動き、umask 022でディレクトリを作る。
  ## このサービスもrootで`mkdir -p -m 0755`を実行し、同じ所有者と権限で作る。
  ## どちらが先に作っても、defaultのworkerは書ける。
  ## `requirements`がsymlinkのときは、何も作らず失敗で終わる。
  ## defaultのworkerで動くものが`factory_state`の下にsymlinkを置いていても、
  ## その先をConsole用workerにマウントさせないため。
  ## 確認からマウントまでの間にsymlinkへ置き換わる隙は、これでは塞げない。
  ## 引数は固定の文字列にし、変数を展開しない。
  ## `sh`は、同じイメージを土台にする`infra/worker/Dockerfile`の`RUN`も使うので、入っている。
  ## ネットワークを持たず、権限もすべて落とし、`factory_state`以外は何もマウントしない。
  ## 終了後のコンテナが残るのは、`depends_on`の判定に使うため。
  factory_state_init:
    image: ghcr.io/windmill-labs/windmill:${WM_VERSION:?run via mise}
    pull_policy: always
    entrypoint:
      - sh
      - -c
      - 'if [ -L /var/lib/factory/requirements ]; then echo "/var/lib/factory/requirements is a symlink" >&2; exit 1; fi; mkdir -p -m 0755 /var/lib/factory/requirements'
    user: "0:0"
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    deploy:
      resources:
        limits:
          memory: 32M
          pids: 16
    volumes:
      - factory_state:/var/lib/factory
    logging: *default-logging

  ## Consoleの問い合わせと操作の受付専用のworker。Claudeの長いジョブがdefaultの枠を
  ## 埋めても、これらの受付を止めないために、tagで分けた別のworkerグループに置く。
  ## 受け付けたscriptが起動するフローとハンドラ(承認のハンドラ、再実行したpipeline、
  ## 監査のフロー)はdefaultのworkerで動く。
  ## 書き込めるマウントは`worker_logs`と専用の依存キャッシュだけにする。
  ## 依存のキャッシュはdefaultの`worker_dependency_cache`とは共有しない。
  ## `factory_state`はボリューム全体ではなく、`requirements`のサブパスだけを読み取り専用で付ける。
  ## ボリューム全体とは、`claude`、`gh`、`audits`、`requirements`などが並ぶ`factory_state`の最上位を指す。
  ## `requirements_doc`が要件定義書と図のファイルをここから読むためで、
  ## ボリューム全体を付けると、`claude`と`gh`の設定(`CLAUDE_CONFIG_DIR`と`GH_CONFIG_DIR`)まで読めてしまう。
  ## 監査レポートは本文をDBから読むので、`audits`は付けない。
  ## `volume.subpath`はDocker Engine 26.0以上とDocker Compose 2.26.0以上が要る。
  ## サブパスのディレクトリが無いとコンテナが起動しないので、
  ## `factory_state_init`が作ってから起動する。
  ## このworkerが`factory_state_init`を経ずに起動するたびに(restart policy、daemonの再起動、
  ## ホストの再起動、手動の`docker compose restart`)、Dockerはサブパスを解決し直す。
  ## その前にdefaultのworkerが`requirements`をsymlinkに置き換えると、先がマウントされうる。
  ## 隙は、`factory_state_init`を経ずにworkerが起動するたびに開く。
  ## 誤ったマウントは、symlinkを消してworkerを起動し直すまで残る。`mise run up`は、
  ## 設定の変わらない、動いているworkerを作り直さないため。`factory_state_init`の失敗で
  ## `up`が止まったら、その時点のworkerのマウントを疑い、docs/operations.mdの手順で直す。
  ## 突くにはdefaultのworkerでのコード実行が要り、
  ## その権限があればボリューム全体を直接読めるので、実害は増えない。
  ## `factory_console`を読み取り専用で付けるのは、取り込みの失敗を見張るscriptが
  ## `status.json`を読むため。`factory_workspaces`は付けない。
  ## nativeでないworkerは1つで動くので、1件のjobが止まっている間は、
  ## ほかのjobが待つ。jobには`timeout`を付けて、止まりきらないようにする。
  ## メモリはbunのプロセス1つが収まる量にする。
  windmill_worker_console:
    image: ghcr.io/windmill-labs/windmill:${WM_VERSION:?run via mise}
    pull_policy: always
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1024M
          pids: 256
    # ゾンビを回収する理由は、上の`windmill_worker`と同じ。
    init: true
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    environment:
      - DATABASE_URL=postgres://postgres:${DB_PASSWORD:?run via mise}@db/windmill?sslmode=disable
      - MODE=worker
      - WORKER_GROUP=console
      - WORKER_TAGS=console
    depends_on:
      db:
        condition: service_healthy
      factory_state_init:
        condition: service_completed_successfully
    volumes:
      - worker_console_dependency_cache:/tmp/windmill/cache
      - worker_logs:/tmp/windmill/logs
      - factory_console:/srv/console:ro
      - type: volume
        source: factory_state
        target: /var/lib/factory/requirements
        read_only: true
        volume:
          subpath: requirements
    logging: *default-logging

  ## 定期ジョブ専用のworker。
  ## Claudeの長いジョブがdefaultの枠を埋めても、定期ジョブを待たせないために、
  ## tagで分けた別のworkerグループに置く。
  ## tag `periodic`を付けるのは、ファイル(`factory_state`、`factory_workspaces`、self clone)にも、
  ## 独自イメージの道具(`claude`、`gh`、`git`、`gtr`、検査の枠)にも、cgroupにも
  ## 依存しない定期ジョブだけにする。依存するジョブはdefaultのworkerに残す。
  ## このworkerは上流のイメージで動き、それらを持たないので、依存するジョブを置くと動かない。
  ## 信頼できない入力を扱うジョブ(リポジトリのコードや検査を動かすもの)も、ここで動かさない。
  ## そのため`factory_workspaces`と`factory_state`は付けない。
  ## 書き込めるマウントは`worker_logs`と専用の依存キャッシュだけにする。
  ## 依存のキャッシュはdefaultの`worker_dependency_cache`とは共有しない。
  ## DBの接続は、ほかのworkerと同じ管理者の接続を使う。
  ## `github_token`などのsecret変数は、ジョブがWindmillの変数から読む。
  ## ケーパビリティは、defaultのworkerと同じものを落とす。権限はdefaultの部分集合に保つ。
  ## nativeでないworkerは1つで動くので、1件のjobが止まっている間は、
  ## ほかのjobが待つ。jobには`timeout`を付けて、止まりきらないようにする。
  ## メモリはbunのプロセス1つが収まる量にする。
  windmill_worker_periodic:
    image: ghcr.io/windmill-labs/windmill:${WM_VERSION:?run via mise}
    pull_policy: always
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1024M
          pids: 256
    # ゾンビを回収する理由は、上の`windmill_worker`と同じ。
    init: true
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - NET_RAW
      - MKNOD
      - SETFCAP
      - AUDIT_WRITE
    environment:
      - DATABASE_URL=postgres://postgres:${DB_PASSWORD:?run via mise}@db/windmill?sslmode=disable
      - MODE=worker
      - WORKER_GROUP=periodic
      - WORKER_TAGS=periodic
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - worker_periodic_dependency_cache:/tmp/windmill/cache
      - worker_logs:/tmp/windmill/logs
    logging: *default-logging

  ## LSPだけを有効にする。multiplayerとdebuggerは、Enterprise向けか攻撃面を
  ## 広げる機能で、この環境には要らない。
  windmill_extra:
    image: ghcr.io/windmill-labs/windmill-extra:${WM_VERSION:?run via mise}
    restart: unless-stopped
    expose:
      - 3001 # LSP
    environment:
      - ENABLE_LSP=true
      - ENABLE_MULTIPLAYER=false
      - ENABLE_DEBUGGER=false
      - WINDMILL_BASE_URL=http://windmill_server:8000
    volumes:
      - lsp_cache:/pyls/.cache
    logging: *default-logging

  caddy:
    # 版を固定する。このイメージと隣の`./Caddyfile`は版が結びついているので、
    # 一緒に更新する。
    image: ghcr.io/windmill-labs/caddy-l4:2.11.4-1
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      # Consoleの配信物。書けるのはconsole_fetcherだけにし、Caddyは読み取り専用にする。
      - factory_console:/srv/console:ro
    ports:
      # `WM_BIND`と`WM_HTTP_PORT`には既定値を置かない。miseの`[env]`で設定する
      # (既定では`WM_BIND=127.0.0.1`でlocalhostだけ)。値が無ければ、
      # 思わぬアドレスで黙って待ち受けず、すぐに失敗させるため。
      - "${WM_BIND:?run via mise}:${WM_HTTP_PORT:?run via mise}:80"
    environment:
      - BASE_URL=:80
    logging: *default-logging

  ## Consoleの成果物をGitHubのCIから取り込み、factory_consoleに置く。
  ## 配信中のJSを書き換えられるのはこのコンテナだけにする(workerのジョブはrootで動くため、
  ## workerに書かせると運用者のブラウザに居座る改ざんの経路になる)。
  ## DBにもWindmillにも届かないよう、専用のnetworkだけに置く。外へは出られるが、
  ## 接続先(api.github.comと成果物の取得先)はコードで限る。
  console_fetcher:
    build:
      context: ./console_fetcher
      labels:
        com.atelier-works.prune: "true"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    tmpfs:
      - /tmp:size=16m
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
          pids: 64
    environment:
      # トークンだけは未設定でも起動する(ファイル冒頭のコメントを参照)。
      - CONSOLE_GITHUB_TOKEN=${CONSOLE_GITHUB_TOKEN:-}
      - CONSOLE_GITHUB_REPO=${CONSOLE_GITHUB_REPO:?run via mise}
    volumes:
      - factory_console:/srv/console
    networks:
      - console_egress
    logging: *default-logging

volumes:
  db_data: null
  worker_dependency_cache: null
  worker_console_dependency_cache: null
  worker_periodic_dependency_cache: null
  worker_logs: null
  caddy_data: null
  lsp_cache: null
  factory_workspaces: null
  factory_state: null
  factory_console: null

networks:
  # console_fetcherだけの外向きのnetwork。他のサービスは既定のnetwork(default)にいるので、
  # ここからDBやWindmillには届かない。
  console_egress:
    driver: bridge
