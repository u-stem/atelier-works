name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Install dependencies
        # `mise run check`はConsoleの検査(console:check)も含むので、Consoleの依存も入れる。
        # Consoleの依存のinstall scriptは実行しない。
        run: |
          bun install --frozen-lockfile
          bun install --cwd console --frozen-lockfile --ignore-scripts

      - name: Lint, typecheck, and test
        run: mise run check

      - name: Determine gitleaks scan range
        # 走査範囲を、このpushやPRで入ったコミットに絞る
        # (上の`fetch-depth: 0`で全履歴を取得している)。
        # 新しいブランチの初回pushで`before`がすべて0のときなど、
        # 差分の基点が無い場合は範囲を空にし、gitleaksに全履歴を走査させる。
        id: gitleaks-range
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          zero="0000000000000000000000000000000000000000"
          range=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="${BASE_SHA}..${HEAD_SHA}"
          elif [ "$EVENT_NAME" = "push" ] && [ "$BEFORE_SHA" != "$zero" ] && [ -n "$BEFORE_SHA" ]; then
            range="${BEFORE_SHA}..${AFTER_SHA}"
          fi
          echo "range=${range}" >> "$GITHUB_OUTPUT"

      - name: Scan for leaked secrets
        # gitleaksは`mise.toml`の`[tools]`から入れる。
        # 別のGitHub Actionでもバージョンを固定すると、固定箇所が2つになるため。
        env:
          SCAN_RANGE: ${{ steps.gitleaks-range.outputs.range }}
        run: |
          set -euo pipefail
          if [ -n "$SCAN_RANGE" ]; then
            mise exec -- gitleaks detect --redact --no-banner --source . --log-opts "$SCAN_RANGE"
          else
            mise exec -- gitleaks detect --redact --no-banner --source .
          fi

      - name: Build worker image
        # `.env`は無く、workerのビルド入力は`mise.toml`の`[env]`にある。
        # `mise exec -c '...'`は`[env]`を適用したシェルでコマンドを実行するので、
        # `$WM_VERSION`などはこのステップのシェル(値を持たない)ではなく、
        # miseのサブシェルで展開される。
        # ビルド引数は`infra/docker-compose.yml`がworkerイメージに渡すものと同じ。
        # 次のステップで使うので、タグを付ける。
        run: |
          mise exec -c '
            docker build infra/worker \
              --tag factory-worker-ci \
              --build-arg WM_VERSION=$WM_VERSION \
              --build-arg CLAUDE_VERSION=$CLAUDE_VERSION \
              --build-arg GH_VERSION=$GH_VERSION \
              --build-arg GITLEAKS_VERSION=$GITLEAKS_VERSION \
              --build-arg GTR_REF=$GTR_REF \
              --build-arg GTR_COMMIT=$GTR_COMMIT \
              --build-arg WMILL_VERSION=$WMILL_VERSION
          '

      - name: Test the process lock in the worker image
        # /procを全件走査するプロセスロックのテストは、rootでないと`mise run check`では飛ばされる。
        # workerと同じ条件で走らせる。同じイメージを使い、自分のPID名前空間の中でrootとして動かす。
        # `--init`はworkerの`init: true`に合わせる。PID 1のtiniが、止めた保持者の孤児を回収するため。
        # bunがPID 1だと孤児がゾンビのまま残り、保持者を止める処理がその終了を待ち続ける。
        # このテストファイルは外部パッケージを使わないので、`node_modules`は要らない。
        run: docker run --rm --init --entrypoint bun -v "$PWD:/src" -w /src factory-worker-ci test tests/lib/process_lock.test.ts

  test-db:
    # `check`ジョブ(とworkerイメージのビルド)から独立させる。
    # Postgresの起動が遅い・不安定なときに、イメージのビルドと互いに待たせないため。
    runs-on: ubuntu-latest
    env:
      # 使い捨て専用の値。`migrations/datatable/main/*.{up,down}.sql`は、
      # `scripts/test-db.sh`が終了時に削除する`factory_test`データベースに適用する。
      # このパスワードが守る本物の`windmill`データベースには触れない。
      # 本物の秘密ではないので、CIに存在しない`mise.local.toml`を通さず直書きしてよい。
      DB_PASSWORD: ci-dummy-password
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Start a scratch Postgres (db service only)
        run: mise exec -- docker compose -f infra/docker-compose.yml up -d db --wait

      - name: Apply and roll back datatable migrations against a scratch database
        run: mise run test:db

      - name: Tear down Postgres
        if: always()
        run: mise exec -- docker compose -f infra/docker-compose.yml down -v

  console:
    # Consoleを組み立て、mainへのpushのときだけ成果物にする。
    # console_fetcherは、このワークフロー全体が成功した実行の成果物だけを取り込む。
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Check the console lockfile policy
        # 依存を入れる前に、取得元がregistryとintegrityに限られることを確かめる。
        run: bun run scripts/check-console-lockfile.ts console/bun.lock

      - name: Install console dependencies
        run: bun install --cwd console --frozen-lockfile --ignore-scripts

      - name: Type-check
        run: bun run --cwd console typecheck

      - name: Lint
        run: bunx --bun biome check console

      - name: Test
        run: bun run --cwd console test

      - name: Build
        run: bun run --cwd console build

      - name: Write the release manifest
        # 全ファイルのsha256と元のcommitを記録する。console_fetcherはこれと中身を照合する。
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: bun run --cwd console write-manifest dist "$SOURCE_SHA"

      - name: Upload the console build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: console-dist
          path: console/dist/
          retention-days: 30
          if-no-files-found: error
          # 同じ実行の「Re-run all jobs」で上げ直しても、名前の衝突で失敗しないようにする。
          overwrite: true

  caddyfile:
    # Caddyfileを、composeで使うのと同じイメージで検証する。
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the Caddyfile
        run: |
          set -euo pipefail
          image="$(grep -oE 'ghcr\.io/windmill-labs/caddy-l4:[^[:space:]]+' infra/docker-compose.yml)"
          docker run --rm -e BASE_URL=:80 \
            -v "$PWD/infra/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "$image" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  console-fetcher-image:
    # console_fetcherのイメージを組み立て、composeと同じ制限(読み取り専用のルート、tmpfs、
    # 権限なし)で1回動かす。トークンが無いので、状態にconfig_missingを書いて終わるはず。
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the console_fetcher image
        run: docker build -t console-fetcher-ci infra/console_fetcher

      - name: Run once without configuration
        run: |
          set -euo pipefail
          output="$(docker run --rm --read-only --tmpfs /tmp:size=16m --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -v console-fetcher-ci:/srv/console console-fetcher-ci once)"
          echo "$output"
          grep -q '"error":"config_missing"' <<<"$output"
