name: CI

on:
  push:
    # `main`へのpushだけで動かす。ほかのブランチはPRの実行が検査する。
    # タグのpushでは動かさない。`main`という名前のタグで動くと、その実行が
    # console_fetcherから「mainの最新の成功した実行」に見え、取り込みが止まる。
    branches: [main]
  # PRはパスで絞らない。lint:docs、文書を読むテスト、docs:gen --check、gitleaksが、
  # `docs/`や`.github/`の文書とテンプレートも対象にするため。
  pull_request:

# 同じ参照の古いPRの実行は止める。`main`の実行は止めず、待機中の取り消しも起こさない。
# `main`の実行を止めると、console_fetcherが取り込む成功した実行が欠けるため。
# `main`の実行は実行ごとに別のグループにする。
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    # 変更したパスから、後続のジョブを動かすかを決める。判定は`scripts/ci-scope.ts`にある。
    # 差分を取れないときは、すべて動かす。
    # `main`へのpushは、直近で成功した実行のcommitからの変更を見る。前の失敗を次の実行で必ず検査し直すため。
    # `mise run`も`mise exec`も使わずbunを直接呼ぶので、bun以外のツールを入れない。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 実行の一覧を読むために、このジョブだけ`actions: read`を足す。読み取りだけで、書き込みは付けない。
    permissions:
      contents: read
      actions: read
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      MISE_EXEC_AUTO_INSTALL: "false"
    outputs:
      db: ${{ steps.scope.outputs.db }}
      worker: ${{ steps.scope.outputs.worker }}
      caddy: ${{ steps.scope.outputs.caddy }}
      fetcher: ${{ steps.scope.outputs.fetcher }}
      metadata: ${{ steps.scope.outputs.metadata }}
      console: ${{ steps.scope.outputs.console }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PRの基点と先頭、pushの基点と今のcommitの差分を取るため、全履歴を取得する。
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # スクリプトを動かすbunだけを入れる。キャッシュは読み書きしない。
          install_args: bun
          cache: false

      - name: Determine which jobs to run
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AFTER_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # `main`へのpushで、直近で成功した実行を調べるために`gh`が読む。PRの実行には渡さない。
          GH_TOKEN: ${{ github.event_name == 'push' && github.token || '' }}
        # `bun run <名前>`は`package.json`のscriptsを先に解決するので、ファイルとして実行する。
        run: bun ./scripts/ci-scope.ts

  check:
    # 常に動かす。lint、型検査、テスト、秘密情報の走査は、どの変更にも要る。
    # `scope`が失敗しても動かす。workerイメージに関わるステップだけを、`scope`の判定で絞る。
    needs: scope
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Consoleの依存のコードも動かすので、gitの資格情報を残さない。
          # 後のステップは取得済みの履歴だけを使い、fetchもpushもしない。
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Install dependencies
        # `mise run check`はConsoleの検査(console:check)も含むので、Consoleの依存も入れる。
        # ルートとConsoleのどちらも、依存のinstall scriptは実行しない。
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun install --cwd console --frozen-lockfile --ignore-scripts

      - name: Lint, typecheck, and test
        run: mise run check

      - name: Determine gitleaks scan range
        # 走査範囲を、PRではbaseの先頭からの変更、`main`へのpushでは直前の先頭からの変更に絞る
        # (上の`fetch-depth: 0`で全履歴を取得している)。
        # `before`がすべて0のときなど、差分の基点が無い場合は範囲を空にし、
        # gitleaksに全履歴を走査させる。
        id: gitleaks-range
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          zero="0000000000000000000000000000000000000000"
          range=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="${BASE_SHA}..${HEAD_SHA}"
          elif [ "$EVENT_NAME" = "push" ] && [ "$BEFORE_SHA" != "$zero" ] && [ -n "$BEFORE_SHA" ]; then
            range="${BEFORE_SHA}..${AFTER_SHA}"
          fi
          echo "range=${range}" >> "$GITHUB_OUTPUT"

      - name: Scan for leaked secrets
        # gitleaksは`mise.toml`の`[tools]`から入れる。
        # 別のGitHub Actionでもバージョンを固定すると、固定箇所が2つになるため。
        env:
          SCAN_RANGE: ${{ steps.gitleaks-range.outputs.range }}
        run: |
          set -euo pipefail
          if [ -n "$SCAN_RANGE" ]; then
            mise exec -- gitleaks detect --redact --no-banner --source . --log-opts "$SCAN_RANGE"
          else
            mise exec -- gitleaks detect --redact --no-banner --source .
          fi

      - name: Build worker image
        if: needs.scope.outputs.worker != 'false'
        # `.env`は無く、workerのビルド入力は`mise.toml`の`[env]`にある。
        # `mise exec -c '...'`は`[env]`を適用したシェルでコマンドを実行するので、
        # `$WM_VERSION`などはこのステップのシェル(値を持たない)ではなく、
        # miseのサブシェルで展開される。
        # ビルド引数は`infra/docker-compose.yml`がworkerイメージに渡すものと同じ。
        # 次のステップで使うので、タグを付ける。
        run: |
          mise exec -c '
            docker build infra/worker \
              --tag factory-worker-ci \
              --build-arg WM_VERSION=$WM_VERSION \
              --build-arg CLAUDE_VERSION=$CLAUDE_VERSION \
              --build-arg GH_VERSION=$GH_VERSION \
              --build-arg GITLEAKS_VERSION=$GITLEAKS_VERSION \
              --build-arg GTR_REF=$GTR_REF \
              --build-arg GTR_COMMIT=$GTR_COMMIT \
              --build-arg WMILL_VERSION=$WMILL_VERSION \
              --build-arg FACTORY_CHECK_UID=$FACTORY_CHECK_UID
          '

      - name: Test the process lock in the worker image
        if: needs.scope.outputs.worker != 'false'
        # /procを全件走査するプロセスロックのテストは、rootでないと`mise run check`では飛ばされる。
        # workerと同じ条件で走らせる。同じイメージを使い、自分のPID名前空間の中でrootとして動かす。
        # `--init`はworkerの`init: true`に合わせる。PID 1のtiniが、止めた保持者の孤児を回収するため。
        # bunがPID 1だと孤児がゾンビのまま残り、保持者を止める処理がその終了を待ち続ける。
        # このテストファイルは外部パッケージを使わないので、`node_modules`は要らない。
        run: docker run --rm --init --entrypoint bun -v "$PWD:/src" -w /src factory-worker-ci test tests/lib/process_lock.test.ts

      - name: Test the check sandbox in the worker image
        if: needs.scope.outputs.worker != 'false'
        # 検査コマンドの境界(別のuidへの切り替え、秘密に届かないこと、書き込める場所、
        # 所有権の受け渡し、残ったプロセスの後始末)を、本物のsetpriv・flock・chown・/procで確かめる。
        # workerと同じ制限のコンテナを使い捨てで起動する。`/tmp/windmill`の権限を書き換えるテストなので、
        # このスクリプトの使い捨てのコンテナの中でだけ走らせる。
        run: scripts/verify-check-sandbox.sh factory-worker-ci

  test-db:
    # `check`ジョブ(とworkerイメージのビルド)から独立させる。
    # Postgresの起動が遅い・不安定なときに、イメージのビルドと互いに待たせないため。
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.db != 'false' }}
    runs-on: ubuntu-latest
    env:
      # 使い捨て専用の値。`migrations/datatable/main/*.{up,down}.sql`は、
      # `scripts/test-db.sh`が終了時に削除する`factory_test`データベースに適用する。
      # このパスワードが守る本物の`windmill`データベースには触れない。
      # 本物の秘密ではないので、CIに存在しない`mise.local.toml`を通さず直書きしてよい。
      DB_PASSWORD: ci-dummy-password
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Start a scratch Postgres (db service only)
        run: mise exec -- docker compose -f infra/docker-compose.yml up -d db --wait

      - name: Apply and roll back datatable migrations against a scratch database
        run: mise run test:db

      - name: Tear down Postgres
        if: always()
        run: mise exec -- docker compose -f infra/docker-compose.yml down -v

  metadata:
    # Windmillのメタデータ(ロック、スキーマ、`wmill-lock.yaml`のハッシュ)が最新かを確かめる。
    # ローカルのpre-pushは、Windmillを起動できないときに`LEFTHOOK_EXCLUDE`で飛ばせる。
    # 飛ばしたコミットが古いメタデータのままマージされると、mainの自動反映がそれを配る。
    # `check`ジョブから独立させる。
    # 関係する変更が無いときは、`scope`ジョブの判定でジョブごと飛ばす。
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.metadata != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 使い捨て専用の値。`test-db`ジョブと同じく、このジョブが起動するPostgresだけが使う。
      # 本物の秘密ではないので、CIに存在しない`mise.local.toml`を通さず直書きしてよい。
      DB_PASSWORD: ci-dummy-password
      # GitHubのランナーはジョブごとに別のVMなので、CIの中では衝突しない。
      # 手元でこのジョブの手順を再現するとき、開発者の`infra`プロジェクトと名前が衝突しないようにする。
      COMPOSE_PROJECT_NAME: metadata-ci
      COMPOSE_FILE: infra/docker-compose.yml:infra/docker-compose.ci.yml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Start Windmill (db and server only)
        # `docker-compose.ci.yml`が、サーバーを`127.0.0.1:8080`に公開する。
        # `metadata:check`は`generate-metadata --dry-run`で、workerを必要としない。
        run: mise exec -- docker compose up -d --wait db windmill_server

      - name: Wait for the Windmill API
        run: |
          set -euo pipefail
          base_url="$(mise exec -- printenv WM_BASE_URL)"
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null --max-time 5 "${base_url}/api/version"; then
              exit 0
            fi
            sleep 2
          done
          echo "Windmill did not become ready at ${base_url}" >&2
          mise exec -- docker compose logs --tail 50 windmill_server >&2
          exit 1

      - name: Register an empty workspace
        # 既定の管理者で空のワークスペース`factory`を作る。使い捨てのサーバー専用の手順。
        run: mise exec -- scripts/ci-metadata-login.sh

      - name: Check that the metadata is up to date
        run: mise run metadata:check

      - name: Show diagnostics
        # ログインやメタデータの検査が失敗したとき、原因を追えるようにサーバーの状態を残す。
        if: failure()
        run: |
          mise exec -- docker compose ps
          mise exec -- docker compose logs --tail 200 windmill_server

      - name: Tear down Windmill
        if: always()
        run: mise exec -- docker compose down -v

  console:
    # Consoleを組み立て、mainへのpushのときだけ成果物にする。
    # console_fetcherは、このワークフロー全体が成功した実行の成果物だけを取り込む。
    # 型検査、lint、テストは`check`ジョブの`mise run check`(console:check)が担う。
    # mainへのpushでは、`scope`ジョブが常に動かす。成果物を毎回上げるため。
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.console != 'false' }}
    runs-on: ubuntu-latest
    env:
      # このジョブは`mise run` / `mise exec`を使わずbunを直接呼ぶ。
      # 入れていない[tools](windmill-cliなど)を、後からmiseが自動で入れないようにする。
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      MISE_EXEC_AUTO_INSTALL: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # 成果物の組み立てに要るbunと、viteとtscを動かすnodeだけを入れる。
          # 他の[tools]のinstall scriptや固定していない依存を、配信物を作るジョブで動かさないため。
          install_args: bun node
          # 他のジョブが書いたキャッシュを読まず、このジョブからも書かない。
          cache: false

      - name: Install root dependencies
        # ルートの依存のinstall scriptも実行しない。
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Check the console lockfile policy
        # 依存を入れる前に、取得元がregistryとintegrityに限られることを確かめる。
        # `bun run <名前>`は`package.json`のscriptsを先に解決するので、ファイルとして実行する。
        run: bun ./scripts/check-console-lockfile.ts console/bun.lock

      - name: Install console dependencies
        run: bun install --cwd console --frozen-lockfile --ignore-scripts

      - name: Build
        run: bun run --cwd console build

      - name: Read the pinned draw.io viewer digest
        id: drawio
        # キャッシュのキーに使う前に、64桁の小文字の16進数であることを確かめる。形が違えば失敗させる。
        run: |
          set -o pipefail
          sha256="$(jq -r .sha256 console/drawio-viewer.json | grep -Ex '[0-9a-f]{64}')"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"

      - name: Restore the draw.io viewer cache
        # 取得物のキャッシュは、固定のsha256をキーにする。
        # キャッシュの中身は信用せず、使う前に固定のsha256と照合するので、汚染されても害は無い。
        # dist/には置かない。dist/drawio/の受け口のscriptまで、キャッシュから戻してしまうため。
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: console/.cache/drawio-viewer
          key: drawio-viewer-${{ steps.drawio.outputs.sha256 }}

      - name: Fetch the draw.io viewer
        # キャッシュが固定のsha256と一致すればそれを使い、無ければ版を固定したURLから取得する。
        # どちらも、固定のsha256と照合してからdist/drawio/に置く。照合に失敗したら、ここで止める。
        # ビューアは、リポジトリに入れない。
        run: bun run --cwd console fetch-drawio-viewer dist/drawio .cache/drawio-viewer

      - name: Write the release manifest
        # 全ファイルのsha256と元のcommitを記録する。console_fetcherはこれと中身を照合する。
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: bun run --cwd console write-manifest dist "$SOURCE_SHA"

      - name: Upload the console build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: console-dist
          path: console/dist/
          retention-days: 30
          if-no-files-found: error
          # 同じ実行の「Re-run all jobs」で上げ直しても、名前の衝突で失敗しないようにする。
          overwrite: true

  caddyfile:
    # Caddyfileを、composeで使うのと同じイメージで検証し、実際に起動して拒否の規則を確かめる。
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.caddy != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the Caddyfile
        run: |
          set -euo pipefail
          image="$(grep -oE 'ghcr\.io/windmill-labs/caddy-l4:[^[:space:]]+' infra/docker-compose.yml)"
          docker run --rm -e BASE_URL=:80 \
            -v "$PWD/infra/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "$image" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Check the origin rules against a running Caddy
        run: bash scripts/check-caddy-origin.sh

  console-fetcher-image:
    # console_fetcherのイメージを組み立て、composeと同じ制限(読み取り専用のルート、tmpfs、
    # 権限なし)で1回動かす。トークンが無いので、状態にconfig_missingを書いて終わるはず。
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.fetcher != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the console_fetcher image
        run: docker build -t console-fetcher-ci infra/console_fetcher

      - name: Run once without configuration
        run: |
          set -euo pipefail
          output="$(docker run --rm --read-only --tmpfs /tmp:size=16m --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -v console-fetcher-ci:/srv/console console-fetcher-ci once)"
          echo "$output"
          grep -q '"error":"config_missing"' <<<"$output"
