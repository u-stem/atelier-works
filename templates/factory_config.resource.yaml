# リソース`f/factory/factory_config`(リソース型`c_factory_config`)の初期値の
# テンプレート。`owners`・`instance_name`・`windmill_public_url`はインスタンス
# 固有なので、このファイルはsyncしない(`wmill.yaml`の`excludes`を参照)。
#
# `scripts/bootstrap.sh`は、リモートにリソースが無いときだけこのテンプレートから
# 作る。作った後はWindmill UI(か`wmill resource push`)で編集し、bootstrapの
# 実行し直しでは変えない。
#
# owners: 人がWindmill UIで入れるまで空にしておく(空ならFactoryはどの
# リポジトリもポーリングしないので、安全な既定値)。記入例:
#   owners:
#     - name: <GitHubのユーザー名か組織名>
#       kind: user   # または"org"
#       id: <GitHubの数値ID>   # 任意。`gh api users/<名前> --jq .id`で調べる
#
# allowed_labeler_ids: 任意。`allowed_labeler_logins`のアカウントの数値IDで、
# `{<ログイン名>: <数値ID>}`の形に書く。`gh api users/<ログイン名> --jq .id`で調べる。
# 入れたアカウントは、同じ名前でもIDが違う人が付けたラベルを許可しない。
# 入れないアカウントは名前だけで照合する。
#
# factory_repo_id: 任意。`factory_repo`のGitHubリポジトリの数値IDで、
# `gh api repos/<owner>/<repo> --jq .id`で調べる。入れると、Factory自身のcloneを使う処理が
# 取得の前に現在のIDと照合し、食い違うときは取得しない。
value:
  owners: []
  trigger_label: factory
  allowed_labeler_associations:
    - OWNER
    - MEMBER
    - COLLABORATOR
  allowed_labeler_logins: []
  allowed_labeler_ids: {}
  model: claude-sonnet-5-5
  heavy_model: claude-opus-5-5
  max_attempts: 3
  max_turns: 40
  max_budget_usd_per_run: 5
  daily_budget_usd: 50
  claude_timeout_sec: 1800
  worktree_ttl_days: 7
  retention_work_items_days: 90
  retention_logs_days: 30
  factory_repo: https://github.com/<owner>/atelier-works
  factory_branch: main
  instance_name: local
  windmill_public_url: http://127.0.0.1:8080
  review_label: "factory:review"
  fix_label: "factory:fix"
  tracked_pr_days: 30
  review_post_mode: comment_only
  max_fix_rounds: 3
  max_fix_changed_files: 30
  max_fix_diff_lines: 1500
  max_lookback_days: 28
  allowed_check_commands: []
  default_reviewers: []
  repo_allowlist: []
  diff_max_lines: 3000
  pr_ci_watch_enabled: true
resource_type: c_factory_config
description: >-
  個人アカウント単体インスタンス向けの初期設定です。ownersとinstance_nameは、この画面から入力してください。
#
# 工程3(実装とPR作成)の設定。ここでは値を足さない。必要になったら、Windmill UIで
# `value`に次のキーを足す。
#   implement_enabled: true
#     要件定義の承認後に実装を自動で開始するか。既定はfalseで、falseの間は
#     承認後に`approved`で止まる(retry_work_itemでの再実行も拒否される)。
#     sandboxリポジトリでe2eを済ませてからtrueにする。
#   check_commands_by_repo:
#     <owner>/<repo>:
#       - bun install --frozen-lockfile
#       - bun test
#     キーは`<owner>/<repo>`、値は実行するコマンドの配列。ここに書いた
#     リポジトリだけで検査を実行する(`allowed_check_commands`は使わない)。
#     Claudeが書いたコードを隔離なしで実行するため、Issueを信頼できる人だけが
#     起票するリポジトリに限る。検査の前に`git clean -fdX`で`node_modules/`などが
#     消えるため、依存関係のあるリポジトリは先頭でインストールする。依存関係が
#     無い(`package.json`が無い)リポジトリなら`bun test`だけでよい。
#   implement_timeout_sec: 3600
#     Claude Codeの1回の実行を打ち切るまでの制限時間(秒)。
#   implement_check_timeout_sec: 900
#     検査コマンド1件を打ち切るまでの制限時間(秒)。
#   implement_flow_timeout_sec: 14400
#     実装1回の期限(秒)。作業領域の準備を始めてから数える。
#   時間の設定と検査コマンドの数は、実装フローのステップのtimeout
#   (`IMPLEMENT_STEP_TIMEOUT_SEC`)に収まる組み合わせにする。収まらないと、実装の
#   準備でneeds_humanになる。既定値なら検査コマンドは7件まで、修正ラウンドを
#   始められる余裕を考えると4件までが目安。計算式は`docs/internals/implement.md`を参照。
