# リソース`f/factory/factory_config`(リソース型`c_factory_config`)の初期値の
# テンプレート。`owners`・`instance_name`・`windmill_public_url`はインスタンス
# 固有なので、このファイルはsyncしない(`wmill.yaml`の`excludes`を参照)。
#
# `scripts/bootstrap.sh`は、リモートにリソースが無いときだけこのテンプレートから
# 作る。作った後はWindmill UI(か`wmill resource push`)で編集し、bootstrapの
# 実行し直しでは変えない。
#
# owners: 人がWindmill UIで入れるまで空にしておく(空ならFactoryはどの
# リポジトリもポーリングしないので、安全な既定値)。記入例:
#   owners:
#     - name: <GitHubのユーザー名か組織名>
#       kind: user   # または"org"
value:
  owners: []
  trigger_label: factory
  allowed_labeler_associations:
    - OWNER
    - MEMBER
    - COLLABORATOR
  model: claude-opus-5-5
  max_attempts: 3
  max_turns: 40
  max_budget_usd_per_run: 5
  daily_budget_usd: 50
  claude_timeout_sec: 1800
  worktree_ttl_days: 7
  retention_work_items_days: 90
  retention_logs_days: 30
  factory_repo: https://github.com/<owner>/atelier-works
  factory_branch: main
  instance_name: local
  windmill_public_url: http://127.0.0.1:8080
  review_label: "factory:review"
  fix_label: "factory:fix"
  tracked_pr_days: 30
  review_post_mode: comment_only
  max_fix_rounds: 3
  max_fix_changed_files: 30
  max_fix_diff_lines: 1500
  max_lookback_days: 28
  allowed_check_commands: []
  default_reviewers: []
  repo_allowlist: []
  diff_max_lines: 3000
resource_type: c_factory_config
description: >-
  個人アカウント単体インスタンス向けの初期設定です。ownersとinstance_nameは、この画面から入力してください。
